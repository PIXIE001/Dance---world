<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2v2 Dance Battle - World of Dance Circular Stage</title>
  <style>
    :root {
      --bg: #05060a;
      --card-bg: rgba(22, 25, 37, 0.85);
      --accent-red: #ff0055;
      --accent-blue: #00f3ff;
      --accent-gold: #ffd700;
      --text: #ffffff;
    }
    body {
      margin: 0;
      padding: 20px;
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: background-color 0.1s ease;
      overflow-x: hidden;
    }
    h1 { margin-bottom: 10px; text-transform: uppercase; letter-spacing: 3px; text-shadow: 0 0 10px var(--accent-blue); }

    /* Flash Effects for Beat Pulses */
    body.beat-pulse {
      background-color: #0d0a1a;
    }

    /* Navigation Tabs */
    .tabs { display: flex; gap: 10px; margin-bottom: 20px; z-index: 10; }
    .tab-btn {
      background: var(--card-bg);
      border: 2px solid #333;
      color: var(--text);
      padding: 10px 20px;
      cursor: pointer;
      font-weight: bold;
      border-radius: 6px;
    }
    .tab-btn.active { border-color: var(--accent-blue); background: #222738; box-shadow: 0 0 10px var(--accent-blue); }

    /* Views */
    .view { display: none; width: 100%; max-width: 900px; }
    .view.active { display: block; }

    /* Scoreboard */
    .score-board {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card-bg);
      padding: 15px 25px;
      border-radius: 8px;
      margin-bottom: 15px;
      font-size: 1.2rem;
      font-weight: bold;
      border: 1px solid #333;
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.8);
      z-index: 10;
      position: relative;
    }
    .team-red { color: var(--accent-red); text-shadow: 0 0 8px var(--accent-red); }
    .team-blue { color: var(--accent-blue); text-shadow: 0 0 8px var(--accent-blue); }

    /* WORLD OF DANCE CIRCULAR STAGE ARENA */
    .stage-container {
      position: relative;
      width: 100%;
      height: 480px;
      perspective: 800px;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 15px;
    }

    /* Spotlight Beams */
    .spotlight {
      position: absolute;
      top: 0;
      width: 120px;
      height: 100%;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.25) 0%, rgba(0, 0, 0, 0) 100%);
      pointer-events: none;
      z-index: 2;
      opacity: 0.6;
      transition: transform 0.1s ease;
    }
    .spotlight.red { left: 20%; transform: rotate(15deg); background: linear-gradient(180deg, rgba(255,0,85,0.3) 0%, rgba(0,0,0,0) 100%); }
    .spotlight.blue { right: 20%; transform: rotate(-15deg); background: linear-gradient(180deg, rgba(0,243,255,0.3) 0%, rgba(0,0,0,0) 100%); }

    /* The Circular WOD Arena Floor */
    .arena-ring-outer {
      position: absolute;
      width: 440px;
      height: 440px;
      border-radius: 50%;
      border: 6px solid var(--accent-blue);
      box-shadow: 0 0 35px var(--accent-blue), inset 0 0 35px var(--accent-blue);
      transform: rotateX(65deg);
      transition: all 0.15s ease;
    }
    .arena-ring-inner {
      position: absolute;
      width: 330px;
      height: 330px;
      border-radius: 50%;
      border: 4px dashed var(--accent-gold);
      box-shadow: 0 0 20px var(--accent-gold);
      transform: rotateX(65deg);
      animation: spinRing 20s linear infinite;
    }
    .arena-center-stage {
      position: absolute;
      width: 220px;
      height: 220px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(0,243,255,0.2) 0%, rgba(13,14,21,0.9) 70%);
      box-shadow: 0 0 30px rgba(0,243,255,0.4);
      transform: rotateX(65deg);
    }

    @keyframes spinRing {
      0% { transform: rotateX(65deg) rotate(0deg); }
      100% { transform: rotateX(65deg) rotate(360deg); }
    }

    /* Beat Pulse on Stage Floor */
    .stage-container.pulse .arena-ring-outer {
      border-color: var(--accent-red);
      box-shadow: 0 0 50px var(--accent-red), inset 0 0 50px var(--accent-red);
    }

    /* Circular Dancer Positioning Layout */
    .arena-dancers {
      position: absolute;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 5;
    }

    .dancer-card {
      position: absolute;
      background: var(--card-bg);
      border: 2px solid #333;
      border-radius: 12px;
      padding: 10px 15px;
      text-align: center;
      width: 120px;
      backdrop-filter: blur(5px);
      transition: transform 0.1s ease, border-color 0.2s ease;
      box-shadow: 0 10px 20px rgba(0,0,0,0.5);
    }
    .dancer-card.red { border-color: var(--accent-red); box-shadow: 0 0 15px rgba(255,0,85,0.4); }
    .dancer-card.blue { border-color: var(--accent-blue); box-shadow: 0 0 15px rgba(0,243,255,0.4); }

    /* Position Dancers around the World of Dance Circle */
    #card-player  { transform: translate(-160px, 40px); }
    #card-partner { transform: translate(-80px, -90px); }
    #card-rival1  { transform: translate(80px, -90px); }
    #card-rival2  { transform: translate(160px, 40px); }

    /* Dance Bounce Animation on Beat */
    .dancer-card.bounce {
      transform: translateY(-12px) scale(1.05) !important;
    }

    .avatar { font-size: 2.8rem; margin: 8px 0; }
    .pose-badge {
      display: inline-block;
      background: #111;
      border: 1px solid #444;
      padding: 3px 6px;
      border-radius: 4px;
      font-size: 0.75rem;
      font-weight: bold;
    }

    /* Judgment Display Overlay */
    #judgment-popup {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0.5);
      font-size: 2.8rem;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 3px;
      pointer-events: none;
      opacity: 0;
      transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      z-index: 12;
    }
    #judgment-popup.show {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1.2);
    }

    /* Particle Canvas Overlay */
    #fx-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 8;
    }

    /* Controls & Track Selector */
    .controls-panel {
      background: var(--card-bg);
      padding: 15px;
      border-radius: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: 1px solid #333;
    }
    select, button.action-btn {
      background: #222738;
      color: #fff;
      border: 1px solid #444;
      padding: 10px 15px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 1rem;
    }
    button.action-btn { background: var(--accent-blue); color: #000; font-weight: bold; border: none; }

    /* Customizer Grid */
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
    .item-card {
      background: var(--card-bg);
      border: 1px solid #333;
      padding: 10px;
      border-radius: 6px;
      text-align: center;
    }
  </style>
</head>
<body>

  <h1>World of Dance 2v2 Stage</h1>

  <div class="tabs">
    <button class="tab-btn active" onclick="switchView('battle')">CIRCULAR ARENA</button>
    <button class="tab-btn" onclick="switchView('wardrobe')">WARDROBE</button>
  </div>

  <!-- BATTLE & RHYTHM VIEW -->
  <div id="view-battle" class="view active">
    <div class="score-board">
      <div class="team-red">RED TEAM: <span id="score-red">0</span> (x<span id="combo-red">0</span>)</div>
      <div>TIME: <span id="timer">30</span>s</div>
      <div class="team-blue">BLUE TEAM: <span id="score-blue">0</span> (x<span id="combo-blue">0</span>)</div>
    </div>

    <!-- CIRCULAR ARENA STAGE SET -->
    <div class="stage-container" id="stage-box">
      <canvas id="fx-canvas"></canvas>
      <div id="judgment-popup">PERFECT!</div>

      <!-- Stage Spotlights -->
      <div class="spotlight red"></div>
      <div class="spotlight blue"></div>

      <!-- World of Dance Floor Rings -->
      <div class="arena-ring-outer"></div>
      <div class="arena-ring-inner"></div>
      <div class="arena-center-stage"></div>

      <!-- 2v2 Circular Dancers -->
      <div class="arena-dancers">
        <!-- Player -->
        <div class="dancer-card red" id="card-player">
          <small>YOU</small>
          <div class="avatar" id="avatar-player">💃</div>
          <div class="pose-badge" id="pose-player">IDLE</div>
        </div>
        <!-- Partner -->
        <div class="dancer-card red" id="card-partner">
          <small>AI PARTNER</small>
          <div class="avatar">👱</div>
          <div class="pose-badge" id="pose-partner">IDLE</div>
        </div>
        <!-- Rival 1 -->
        <div class="dancer-card blue" id="card-rival1">
          <small>RIVAL 1</small>
          <div class="avatar">👨‍🎤</div>
          <div class="pose-badge" id="pose-rival1">IDLE</div>
        </div>
        <!-- Rival 2 -->
        <div class="dancer-card blue" id="card-rival2">
          <small>RIVAL 2</small>
          <div class="avatar">🧢</div>
          <div class="pose-badge" id="pose-rival2">IDLE</div>
        </div>
      </div>
    </div>

    <div class="controls-panel">
      <div>
        <label for="track-select">Track: </label>
        <select id="track-select" onchange="changeTrack(this.value)">
          <option value="track_1">City Lights Groove (100 BPM)</option>
          <option value="track_2">Cyberpunk Rush (128 BPM)</option>
          <option value="track_3">Neon Velocity (150 BPM)</option>
        </select>
      </div>
      <button class="action-btn" id="start-btn" onclick="toggleBattle()">START BATTLE</button>
      <button class="action-btn" onclick="triggerHit()">HIT NOTE (Space)</button>
    </div>
  </div>

  <!-- WARDROBE VIEW -->
  <div id="view-wardrobe" class="view">
    <h3>Wardrobe Inventory</h3>
    <div class="grid" id="wardrobe-grid"></div>
  </div>

<script>
// ==========================================
// DATA & STATE MANAGEMENT
// ==========================================
const ITEM_LIB = {
  HAIR: [{ id: 'h1', name: 'Classic Afro', icon: '👩‍🦱' }, { id: 'h2', name: 'Cyber Dreads', icon: '👨‍🎤' }],
  TOPS: [{ id: 't1', name: 'Street Hoodie', icon: '🧥' }, { id: 't2', name: 'Disco Tank', icon: '👔' }],
  BOTTOMS: [{ id: 'b1', name: 'Cargo Pants', icon: '👖' }, { id: 'b2', name: 'Track Pants', icon: '🩳' }],
  SHOES: [{ id: 's1', name: 'Hi-Top Kicks', icon: '👟' }, { id: 's2', name: 'Golden Boots', icon: '👢' }]
};

const TRACK_LIST = [
  { id: 'track_1', title: 'City Lights Groove', bpm: 100 },
  { id: 'track_2', title: 'Cyberpunk Rush', bpm: 128 },
  { id: 'track_3', title: 'Neon Velocity', bpm: 150 }
];

let currentTrack = TRACK_LIST[0];
let battleState = {
  teamRedScore: 0,
  teamBlueScore: 0,
  teamRedCombo: 0,
  teamBlueCombo: 0,
  timeRemaining: 30,
  isActive: false,
  timerId: null,
  aiLoopId: null,
  lastBeatTime: 0
};

let particles = [];
let canvas, ctx;

// ==========================================
// GAME LOGIC & BATTLE ENGINE
// ==========================================
function toggleBattle() {
  if (battleState.isActive) {
    end2v2Battle();
  } else {
    start2v2Battle();
  }
}

function start2v2Battle() {
  battleState.teamRedScore = 0;
  battleState.teamBlueScore = 0;
  battleState.teamRedCombo = 0;
  battleState.teamBlueCombo = 0;
  battleState.timeRemaining = 30;
  battleState.isActive = true;

  document.getElementById('start-btn').innerText = 'STOP BATTLE';
  updateScoreboard();

  battleState.timerId = setInterval(() => {
    battleState.timeRemaining--;
    document.getElementById('timer').innerText = battleState.timeRemaining;
    if (battleState.timeRemaining <= 0) end2v2Battle();
  }, 1000);

  const intervalMs = (60 / currentTrack.bpm) * 1000;
  
  battleState.aiLoopId = setInterval(() => {
    if (!battleState.isActive) return;
    
    battleState.lastBeatTime = Date.now();
    pulseStage();

    if (Math.random() < 0.8) {
      battleState.teamRedScore += 100;
      battleState.teamRedCombo++;
      triggerPose('pose-partner');
    }
    if (Math.random() < 0.82) {
      battleState.teamBlueScore += 150;
      battleState.teamBlueCombo++;
      triggerPose('pose-rival1');
      triggerPose('pose-rival2');
    }
    updateScoreboard();
  }, intervalMs);
}

function triggerHit() {
  if (!battleState.isActive) return;

  const now = Date.now();
  const intervalMs = (60 / currentTrack.bpm) * 1000;
  const timeSinceBeat = (now - battleState.lastBeatTime) % intervalMs;
  const diff = Math.min(timeSinceBeat, intervalMs - timeSinceBeat);

  let rating = 'MISS';
  let points = 0;
  let color = '#ff0055';

  if (diff < 90) {
    rating = 'PERFECT!';
    points = 200;
    color = '#ffd700';
    spawnParticles(color, 25);
  } else if (diff < 180) {
    rating = 'GREAT';
    points = 100;
    color = '#00f3ff';
    spawnParticles(color, 12);
  } else {
    rating = 'MISS';
    battleState.teamRedCombo = 0;
  }

  if (points > 0) {
    battleState.teamRedCombo++;
    battleState.teamRedScore += points + (battleState.teamRedCombo * 10);
    triggerPose('pose-player');
  }

  showJudgment(rating, color);
  updateScoreboard();
}

function showJudgment(text, color) {
  const popup = document.getElementById('judgment-popup');
  popup.innerText = text;
  popup.style.color = color;
  popup.style.textShadow = `0 0 15px ${color}`;
  popup.classList.add('show');

  setTimeout(() => popup.classList.remove('show'), 300);
}

function pulseStage() {
  document.body.classList.add('beat-pulse');
  const stageBox = document.getElementById('stage-box');
  stageBox.classList.add('pulse');

  setTimeout(() => {
    document.body.classList.remove('beat-pulse');
    stageBox.classList.remove('pulse');
  }, 120);

  const cards = document.querySelectorAll('.dancer-card');
  cards.forEach(c => c.classList.add('bounce'));
  setTimeout(() => cards.forEach(c => c.classList.remove('bounce')), 150);
}

function end2v2Battle() {
  battleState.isActive = false;
  clearInterval(battleState.timerId);
  clearInterval(battleState.aiLoopId);
  document.getElementById('start-btn').innerText = 'START BATTLE';
  
  const result = battleState.teamRedScore >= battleState.teamBlueScore ? 'VICTORY!' : 'DEFEAT!';
  alert(`Game Over! ${result}\nRed: ${battleState.teamRedScore} | Blue: ${battleState.teamBlueScore}`);
}

function triggerPose(elementId) {
  const poses = ['LEFT ⬅️', 'RIGHT ➡️', 'UP ⬆️', 'DOWN ⬇️', 'SPIN 🌀'];
  const pose = poses[Math.floor(Math.random() * poses.length)];
  document.getElementById(elementId).innerText = pose;
}

function updateScoreboard() {
  document.getElementById('score-red').innerText = battleState.teamRedScore;
  document.getElementById('combo-red').innerText = battleState.teamRedCombo;
  document.getElementById('score-blue').innerText = battleState.teamBlueScore;
  document.getElementById('combo-blue').innerText = battleState.teamBlueCombo;
}

function changeTrack(trackId) {
  currentTrack = TRACK_LIST.find(t => t.id === trackId) || TRACK_LIST[0];
  if (battleState.isActive) {
    clearInterval(battleState.aiLoopId);
    start2v2Battle();
  }
}

// ==========================================
// CANVAS PARTICLE EFFECTS ENGINE
// ==========================================
function initCanvas() {
  canvas = document.getElementById('fx-canvas');
  ctx = canvas.getContext('2d');
  resizeCanvas();
  window.addEventListener('resize', resizeCanvas);
  requestAnimationFrame(renderParticles);
}

function resizeCanvas() {
  const box = document.getElementById('stage-box');
  canvas.width = box.clientWidth;
  canvas.height = box.clientHeight;
}

function spawnParticles(color, count) {
  for (let i = 0; i < count; i++) {
    particles.push({
      x: canvas.width / 2,
      y: canvas.height / 2,
      vx: (Math.random() - 0.5) * 14,
      vy: (Math.random() - 0.5) * 14,
      radius: Math.random() * 5 + 2,
      color: color,
      alpha: 1
    });
  }
}

function renderParticles() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.alpha -= 0.03;

    if (p.alpha <= 0) {
      particles.splice(i, 1);
      continue;
    }

    ctx.save();
    ctx.globalAlpha = p.alpha;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
    ctx.fillStyle = p.color;
    ctx.shadowBlur = 10;
    ctx.shadowColor = p.color;
    ctx.fill();
    ctx.restore();
  }

  requestAnimationFrame(renderParticles);
}

// ==========================================
// UI & NAVIGATION
// ==========================================
function switchView(viewName) {
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  
  document.getElementById(`view-${viewName}`).classList.add('active');
  event.target.classList.add('active');
}

function renderWardrobe() {
  const container = document.getElementById('wardrobe-grid');
  container.innerHTML = '';
  
  Object.keys(ITEM_LIB).forEach(cat => {
    ITEM_LIB[cat].forEach(item => {
      container.innerHTML += `
        <div class="item-card">
          <div style="font-size:2rem;">${item.icon}</div>
          <div><strong>${item.name}</strong></div>
          <small>${cat}</small>
        </div>
      `;
    });
  });
}

window.addEventListener('keydown', (e) => {
  if (e.code === 'Space') {
    triggerHit();
  }
});

initCanvas();
renderWardrobe();
</script>
</body>
</html>
