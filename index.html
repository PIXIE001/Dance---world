<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>World of Dance: Stage Battle</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Impact, sans-serif; }
    body {
      background: #08090d;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }
    
    #game-container {
      width: 960px;
      height: 640px;
      position: relative;
      border: 3px solid #ff0055;
      border-radius: 12px;
      box-shadow: 0 0 30px rgba(255, 0, 85, 0.4);
      overflow: hidden;
      background: #000;
    }

    /* REAL DANCE STAGE BACKGROUND */
    .stage-bg {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background-size: cover;
      background-position: center;
      transition: filter 0.2s, transform 0.2s;
    }

    /* FLASH & STROBE EFFECTS */
    .stage-overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none;
      background: radial-gradient(circle at center, transparent 30%, rgba(0,0,0,0.8) 90%);
    }
    .flash-effect {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.1s ease-out;
    }

    /* TOP HUD */
    .hud {
      position: absolute;
      top: 0; left: 0; width: 100%;
      padding: 15px 25px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: linear-gradient(180deg, rgba(0,0,0,0.85) 0%, rgba(0,0,0,0) 100%);
      z-index: 10;
    }
    .hud-title {
      font-size: 24px; font-style: italic; font-weight: 900;
      background: linear-gradient(45deg, #00f0ff, #ff0055);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .hud-stats { display: flex; gap: 20px; font-size: 18px; font-weight: bold; }
    .hud-val { color: #00f0ff; }

    /* REAL-TIME DANCE JUDGE METER */
    .judge-panel {
      position: absolute;
      bottom: 25px; left: 25px;
      background: rgba(13, 14, 21, 0.85);
      border: 1px solid #00f0ff;
      border-radius: 8px;
      padding: 12px 18px;
      width: 220px;
      z-index: 10;
      backdrop-filter: blur(5px);
    }
    .judge-label { font-size: 11px; text-transform: uppercase; color: #aaa; letter-spacing: 1px; }
    .judge-bar { width: 100%; height: 8px; background: #222; border-radius: 4px; overflow: hidden; margin: 4px 0 10px 0; }
    .judge-fill { height: 100%; width: 0%; transition: width 0.3s; background: linear-gradient(90deg, #ff0055, #00f0ff); }

    /* DYNAMIC STAGE POSE TARGET (NO ARROWS) */
    .pose-target {
      position: absolute;
      width: 110px; height: 110px;
      border-radius: 50%;
      border: 4px solid #00f0ff;
      box-shadow: 0 0 20px #00f0ff, inset 0 0 15px #00f0ff;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      transform: translate(-50%, -50%) scale(0);
      transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.27);
      z-index: 15;
      cursor: pointer;
    }
    .pose-key { font-size: 36px; font-weight: 900; color: #fff; text-shadow: 0 0 10px #00f0ff; }
    .pose-action { font-size: 11px; font-weight: bold; text-transform: uppercase; color: #ffd700; letter-spacing: 1px; }

    .pulse-ring {
      position: absolute;
      width: 100%; height: 100%;
      border-radius: 50%;
      border: 2px solid #ff0055;
      animation: pulse 0.8s infinite linear;
    }
    @keyframes pulse {
      0% { transform: scale(1); opacity: 1; }
      100% { transform: scale(1.6); opacity: 0; }
    }

    /* FEEDBACK POPUP */
    .feedback {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%) scale(0.8);
      font-size: 48px; font-weight: 900; font-style: italic;
      pointer-events: none; opacity: 0;
      transition: opacity 0.15s, transform 0.15s;
      z-index: 20;
      text-shadow: 0 0 20px #000;
    }
    .feedback.show { opacity: 1; transform: translate(-50%, -60%) scale(1.1); }

    /* START / END OVERLAY */
    .overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(8, 9, 13, 0.9);
      display: flex; flex-direction: column;
      justify-content: center; align-items: center;
      z-index: 30;
      text-align: center;
      padding: 20px;
    }
    .btn {
      background: linear-gradient(45deg, #ff0055, #00f0ff);
      border: none; color: white;
      padding: 14px 36px; font-size: 22px; font-weight: bold;
      border-radius: 30px; cursor: pointer;
      box-shadow: 0 0 20px rgba(255, 0, 85, 0.6);
      margin-top: 25px; transition: transform 0.2s;
    }
    .btn:hover { transform: scale(1.08); }
  </style>
</head>
<body>

<div id="game-container">
  <!-- Dynamic Stage Image Background -->
  <div class="stage-bg" id="stage-bg"></div>
  <div class="stage-overlay"></div>
  <div class="flash-effect" id="flash"></div>

  <!-- HUD -->
  <div class="hud">
    <div class="hud-title">WORLD OF DANCE</div>
    <div class="hud-stats">
      <div>SCORE: <span class="hud-val" id="score">0</span></div>
      <div>COMBO: <span class="hud-val" id="combo">0</span></div>
    </div>
  </div>

  <!-- Evaluation Bars -->
  <div class="judge-panel">
    <div class="judge-label">Execution</div>
    <div class="judge-bar"><div class="judge-fill" id="bar-exec"></div></div>
    <div class="judge-label">Synchronization</div>
    <div class="judge-bar"><div class="judge-fill" id="bar-sync"></div></div>
  </div>

  <!-- Target Prompt -->
  <div class="pose-target" id="target" onclick="triggerHit()">
    <div class="pulse-ring"></div>
    <div class="pose-key" id="target-key">J</div>
    <div class="pose-action" id="target-action">POWER MOVE</div>
  </div>

  <!-- Text Feedback -->
  <div class="feedback" id="feedback">PERFECT!</div>

  <!-- Start/Result Overlay -->
  <div class="overlay" id="overlay">
    <h1 style="font-size: 52px; font-weight: 900; background: linear-gradient(45deg, #ff0055, #00f0ff); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">
      STAGE PERFORMANCE BATTLE
    </h1>
    <p style="color: #aaa; margin-top: 10px; max-width: 500px; font-size: 16px;">
      Hit the key prompts as B-Boys and B-Girls hit their power moves and freezes on stage!
    </p>
    <button class="btn" onclick="startGame()">START PERFORMANCE</button>
  </div>
</div>

<script>
  // High-res Stage Image URL
  const STAGE_IMG = 'watermarked_img_7245008821276142257.png';

  // Hotkeys & Pose Actions
  const POSE_EVENTS = [
    { key: 'J', action: 'FREEZE', x: 75, y: 65 },
    { key: 'K', action: 'POWER MOVE', x: 50, y: 55 },
    { key: 'L', action: 'TOPROCK', x: 25, y: 60 },
    { key: 'I', action: 'SYNCHRO', x: 62, y: 50 },
    { key: 'U', action: 'FLARE', x: 35, y: 65 }
  ];

  let score = 0;
  let combo = 0;
  let execScore = 50;
  let syncScore = 50;
  let currentTarget = null;
  let promptTimeout = null;
  let isPlaying = false;

  const stageBg = document.getElementById('stage-bg');
  const targetEl = document.getElementById('target');
  const targetKeyEl = document.getElementById('target-key');
  const targetActionEl = document.getElementById('target-action');
  const feedbackEl = document.getElementById('feedback');
  const flashEl = document.getElementById('flash');

  // Set Background Image
  stageBg.style.backgroundImage = `url('${STAGE_IMG}')`;

  function startGame() {
    document.getElementById('overlay').style.display = 'none';
    score = 0;
    combo = 0;
    execScore = 60;
    syncScore = 60;
    isPlaying = true;

    updateUI();
    nextBeat();
  }

  function nextBeat() {
    if (!isPlaying) return;

    // Pick a random dancer on stage to target
    currentTarget = POSE_EVENTS[Math.floor(Math.random() * POSE_EVENTS.length)];
    
    // Position target node over stage location
    targetEl.style.left = currentTarget.x + '%';
    targetEl.style.top = currentTarget.y + '%';
    targetKeyEl.innerText = currentTarget.key;
    targetActionEl.innerText = currentTarget.action;

    // Show prompt
    targetEl.style.transform = 'translate(-50%, -50%) scale(1)';

    // Timed Window to hit key
    promptTimeout = setTimeout(() => {
      // Missed prompt
      registerMiss();
    }, 1200);
  }

  function triggerHit() {
    if (!isPlaying || !currentTarget) return;

    clearTimeout(promptTimeout);
    
    combo++;
    score += 150 + combo * 20;
    execScore = Math.min(100, execScore + 8);
    syncScore = Math.min(100, syncScore + 6);

    showFeedback('PERFECT!', '#00ff66');
    stageFlash('#00f0ff');
    hideTarget();

    setTimeout(nextBeat, Math.random() * 600 + 400);
  }

  function registerMiss() {
    combo = 0;
    execScore = Math.max(0, execScore - 12);
    syncScore = Math.max(0, syncScore - 10);

    showFeedback('MISS', '#ff0055');
    stageFlash('#ff0055');
    hideTarget();

    if (execScore <= 0) {
      endGame(false);
    } else {
      setTimeout(nextBeat, 600);
    }
  }

  function hideTarget() {
    targetEl.style.transform = 'translate(-50%, -50%) scale(0)';
    updateUI();
  }

  function stageFlash(color) {
    flashEl.style.background = color;
    flashEl.style.opacity = '0.3';
    stageBg.style.transform = 'scale(1.02)';
    
    setTimeout(() => {
      flashEl.style.opacity = '0';
      stageBg.style.transform = 'scale(1)';
    }, 150);
  }

  function showFeedback(text, color) {
    feedbackEl.innerText = text;
    feedbackEl.style.color = color;
    feedbackEl.classList.add('show');
    setTimeout(() => feedbackEl.classList.remove('show'), 250);
  }

  function updateUI() {
    document.getElementById('score').innerText = score;
    document.getElementById('combo').innerText = combo;
    document.getElementById('bar-exec').style.width = execScore + '%';
    document.getElementById('bar-sync').style.width = syncScore + '%';
  }

  document.addEventListener('keydown', (e) => {
    if (!isPlaying || !currentTarget) return;

    if (e.key.toUpperCase() === currentTarget.key) {
      triggerHit();
    }
  });

  function endGame(win = true) {
    isPlaying = false;
    clearTimeout(promptTimeout);
    
    const overlay = document.getElementById('overlay');
    overlay.style.display = 'flex';
    overlay.innerHTML = `
      <h1 style="color: ${win ? '#00f0ff' : '#ff0055'}; font-size: 48px;">${win ? 'STAGE CLEARED!' : 'ELIMINATED'}</h1>
      <p style="font-size: 20px; margin-top: 10px;">FINAL SCORE: <b>${score}</b></p>
      <p style="color: #aaa; margin-top: 5px;">Execution: ${execScore}% | Synchronization: ${syncScore}%</p>
      <button class="btn" onclick="startGame()">RETRY STAGE</button>
    `;
  }
</script>
</body>
</html>
