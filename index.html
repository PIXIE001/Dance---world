window.WOD_TRAIN_MOVE =
function(moveId){

    if(
        !WOD_TRAINING.active
    )
        return;


    const move =
        WOD_MOVES.find(
            m => m.id === moveId
        );


    if(!move)
        return;


    const success =
        Math.random();


    let multiplier;


    if(
        success > .8
    ){

        multiplier=1.6;

        WOD_TRAINING.perfect++;

    }

    else if(
        success > .3
    ){

        multiplier=1;

    }

    else{

        multiplier=.2;

    }


    WOD_TRAINING.score +=
        Math.round(
            move.points *
            multiplier
        );


    WOD_TRAINING.moves++;


    const dancer =
        document.getElementById(
            "trainingDancer"
        );


    if(dancer){

        dancer.classList.remove(
            "trainingMove"
        );

        void dancer.offsetWidth;

        dancer.classList.add(
            "trainingMove"
        );

    }


    const score =
        document.getElementById(
            "trainingScore"
        );


    if(score){

        score.textContent =
            WOD_TRAINING.score;

    }

};


function startTrainingTimer(){

    clearInterval(
        WOD_TRAINING.timer
    );


    WOD_TRAINING.timer =
        setInterval(
            function(){

                WOD_TRAINING.seconds--;


                const timer =
                    document.getElementById(
                        "trainingTimer"
                    );


                if(timer)
                    timer.textContent =
                        WOD_TRAINING.seconds;


                if(
                    WOD_TRAINING.seconds <= 0
                ){

                    finishTraining();

                }

            },
            1000
        );

}


function finishTraining(){

    clearInterval(
        WOD_TRAINING.timer
    );


    WOD_TRAINING.active=false;


    const gain =
        Math.max(
            10,
            Math.round(
                WOD_TRAINING.score /
                40
            )
        );


    addWODXP(
        gain
    );


    WOD_PLAYER.trainingSessions++;


    /* TRAINING STAT IMPROVEMENT */

    const stats =
        [
            "power",
            "technique",
            "rhythm",
            "stamina",
            "freestyle"
        ];


    const stat =
        stats[
            Math.floor(
                Math.random() *
                stats.length
            )
        ];


    WOD_PLAYER.stats[stat] =
        Math.min(
            100,
            WOD_PLAYER.stats[stat] +
            1
        );


    saveWODPlayer();


    const screen =
        document.getElementById(
            "wodTrainingScreen"
        );


    if(screen){

        screen.innerHTML = `

            <div class="trainingComplete">

                <small>
                    TRAINING COMPLETE
                </small>

                <h1>
                    ${WOD_TRAINING.score}
                </h1>

                <p>
                    +${gain} XP
                </p>

                <b>
                    ${stat.toUpperCase()}
                    +1
                </b>

                <button
                    onclick="
                        closeWODTraining()
                    ">

                    RETURN

                </button>

            </div>

        `;

    }

}

            flex-direction:column;
            align-items:center;
            justify-content:center;
            text-align:center;
            padding:20px;
            background:
                radial-gradient(
                    circle,
                    #18204a,
                    #050711 70%
                );
        }


        .trainingComplete small{
            color:#7ea4ff;
            letter-spacing:3px;
            font-size:7px;
        }


        .trainingComplete h1{
            margin:12px 0;
            font-size:48px;
        }


        .trainingComplete p{
            color:#66ffc5;
            font-weight:900;
        }


        .trainingComplete b{
            color:#7ea4ff;
            font-size:8px;
        }


        .trainingComplete button{
            margin-top:25px;
            width:100%;
            max-width:320px;
            padding:12px;
            border:0;
            border-radius:10px;
            background:
                linear-gradient(
                    135deg,
                    #3976ff,
                    #9345ff
                );
            color:white;
            font-weight:900;
            font-size:7px;
        }


        /* PROFILE */


        .wodProfile{
            min-height:100%;
            padding:15px;
            background:
                radial-gradient(
                    circle at 50% 0,
                    #18214a,
                    #050711 50%
                );
        }


        .profileAvatar{
            position:relative;
            width:110px;
            height:160px;
            margin:
                35px auto 10px;
        }


        .profileAvatar .avatarHead{
            left:36px;
        }


        .profileAvatar .avatarBody{
            left:22px;
        }


        .profileAvatar .avatarLeg.left{
            left:32px;
        }


        .profileAvatar .avatarLeg.right{
            right:32px;
        }


        .wodProfile h1{
            margin:0;
            text-align:center;
            font-size:24px;
        }


        .wodProfile > p{
            margin:
                5px 0 20px;
            text-align:center;
            color:#7ea4ff;
            font-size:7px;
            letter-spacing:2px;
        }


        .profileXP{
            margin:0 auto 18px;
            max-width:420px;
        }


        .profileXP div{
            display:flex;
            justify-content:space-between;
            color:#8b94ad;
            font-size:7px;
        }


        .profileXP i{
            display:block;
            height:6px;
            margin-top:6px;
            overflow:hidden;
            border-radius:8px;
            background:
                rgba(255,255,255,.08);
        }


        .profileXP i::after{
            content:"";
            display:block;
            height:100%;
            background:
                linear-gradient(
                    90deg,
                    #3976ff,
                    #66ffc5
                );
        }


        .profileStats{
            display:grid;
            grid-template-columns:
                repeat(4,1fr);
            gap:5px;
            max-width:500px;
            margin:auto;
        }


        .profileStats div{
            padding:10px 4px;
            text-align:center;
            border-radius:9px;
            background:
                rgba(255,255,255,.04);
        }


        .profileStats b{
            display:block;
            font-size:14px;
        }


        .profileStats span{
            display:block;
            margin-top:3px;
            color:#7b87a4;
            font-size:4px;
        }


        .profileSkillTitle{
            margin:
                25px 0 10px;
            font-size:8px;
            letter-spacing:2px;
        }


        .skill{
            margin-bottom:9px;
        }


        .skill > div{
            display:flex;
            justify-content:space-between;
            font-size:6px;
            text-transform:uppercase;
        }


        .skill > i{
            display:block;
            height:6px;
            margin-top:4px;
            overflow:hidden;
            border-radius:8px;
            background:
                rgba(255,255,255,.08);
        }


        .skill em{
            display:block;
            height:100%;
            border-radius:8px;
            background:
                linear-gradient(
                    90deg,
                    #3976ff,
                    #9345ff
                );
        }


        .wodLevelUp{
            position:fixed;
            inset:0;
            z-index:100000;
            background:
                rgba(3,5,12,.9);
            backdrop-filter:
                blur(12px);
        }


        .wodLevelUp > div{
            width:min(
                90%,
                350px
            );
            padding:30px;
            text-align:center;
            border:1px solid
                rgba(255,255,255,.1);
            border-radius:18px;
            background:
                #0d1122;
        }


        .wodLevelUp small{
            color:#7ea4ff;
            font-size:7px;
            letter-spacing:2px;
        }


        .wodLevelUp strong{
            display:block;
            margin:8px;
            font-size:60px;
        }


        .wodLevelUp p{
            color:#8b94ad;
            font-size:7px;
        }


        .wodLevelUp button{
            width:100%;
            padding:11px;
            border:0;
            border-radius:9px;
            background:
                linear-gradient(
                    135deg,
                    #3976ff,
                    #9345ff
                );
            color:white;
            font-weight:900;
            font-size:7px;
        }

    `;


    document.head.appendChild(
        style
    );

}

   QUICK ACCESS API
========================================================= */

window.WOD_OPEN_STUDIO =
    openWODCustomization;

window.WOD_OPEN_TRAINING =
    openWODTraining;

window.WOD_OPEN_PROFILE =
    openWODProfile;

========================================================= */

    "BUILD 19 + 20 + 21 ONLINE"
);

})();
