<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#050711">
<title>WORLD OF DANCE — MASTER BUILD</title>

<style>
:root{
  --bg:#050711;
  --panel:#0c1122;
  --panel2:#111831;
  --line:rgba(255,255,255,.12);
  --text:#f5f7ff;
  --muted:#8e9ab8;
  --cyan:#48ddff;
  --blue:#4d70ff;
  --purple:#8b4dff;
  --green:#39e0a0;
  --gold:#ffc44d;
  --danger:#ff5577;
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  width:100%;
  height:100%;
  margin:0;
  overflow:hidden;
  background:var(--bg);
  color:var(--text);
  font-family:Arial,Helvetica,sans-serif;
}

button{
  border:0;
  color:white;
  font:inherit;
  cursor:pointer;
}

#app{
  position:relative;
  width:100vw;
  height:100vh;
  overflow:hidden;
  background:
    radial-gradient(circle at 50% 25%,
      #253866 0,
      #111936 25%,
      #070a16 58%,
      #03040a 100%);
}

/* =====================================================
   WORLD BACKGROUND
===================================================== */

.skyGlow{
  position:absolute;
  width:70vw;
  height:70vw;
  max-width:800px;
  max-height:800px;
  left:50%;
  top:5%;
  transform:translateX(-50%);
  border-radius:50%;
  background:radial-gradient(circle,
    rgba(80,190,255,.18),
    rgba(100,70,255,.08) 40%,
    transparent 70%);
  filter:blur(12px);
  pointer-events:none;
}

.city{
  position:absolute;
  left:0;
  right:0;
  bottom:28%;
  height:30%;
  display:flex;
  align-items:flex-end;
  gap:2px;
  opacity:.6;
  pointer-events:none;
}

.building{
  flex:1;
  min-width:12px;
  background:linear-gradient(
    180deg,
    #17203a,
    #070a13
  );
  position:relative;
}

.building:after{
  content:"";
  position:absolute;
  inset:8px;
  background:
    repeating-linear-gradient(
      90deg,
      transparent 0 9px,
      rgba(90,210,255,.18) 10px 12px
    ),
    repeating-linear-gradient(
      0deg,
      transparent 0 12px,
      rgba(255,210,80,.1) 13px 15px
    );
}

.stage{
  position:absolute;
  left:-10%;
  right:-10%;
  bottom:15%;
  height:34%;
  transform:perspective(400px) rotateX(58deg);
  transform-origin:bottom;
  background:
    linear-gradient(
      rgba(75,180,255,.12) 1px,
      transparent 1px
    ),
    linear-gradient(
      90deg,
      rgba(75,180,255,.12) 1px,
      transparent 1px
    );
  background-size:65px 40px;
  pointer-events:none;
}

.stageGlow{
  position:absolute;
  left:8%;
  right:8%;
  bottom:24%;
  height:3px;
  background:linear-gradient(
    90deg,
    transparent,
    var(--cyan),
    white,
    var(--cyan),
    transparent
  );
  box-shadow:0 0 30px var(--cyan);
}

/* =====================================================
   HEADER
===================================================== */

.header{
  position:absolute;
  z-index:30;
  top:0;
  left:0;
  right:0;
  height:70px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:9px 16px;
  background:linear-gradient(
    180deg,
    rgba(2,3,9,.92),
    rgba(2,3,9,.25)
  );
}

.brand{
  font-size:clamp(15px,2.5vw,25px);
  font-weight:1000;
  letter-spacing:2px;
  white-space:nowrap;
}

.brand i{
  color:var(--cyan);
  font-style:normal;
}

.resources{
  display:flex;
  gap:6px;
}

.resource{
  min-width:68px;
  padding:5px 9px;
  text-align:center;
  background:rgba(9,13,29,.82);
  border:1px solid var(--line);
  border-radius:9px;
}

.resource small{
  display:block;
  color:var(--muted);
  font-size:8px;
}

.resource strong{
  display:block;
  font-size:13px;
  margin-top:2px;
}

/* =====================================================
   WORLD AREA
===================================================== */

.world{
  position:absolute;
  inset:70px 0 105px;
  overflow:hidden;
}

.location{
  position:absolute;
  top:12px;
  left:50%;
  transform:translateX(-50%);
  z-index:10;
  padding:7px 18px;
  border-radius:20px;
  background:rgba(3,5,13,.58);
  border:1px solid var(--line);
  font-size:10px;
  font-weight:800;
  letter-spacing:2px;
}

.location span{
  color:var(--cyan);
}

/* =====================================================
   DANCER
===================================================== */

.dancer{
  position:absolute;
  width:150px;
  height:300px;
  left:50%;
  bottom:13%;
  transform:translateX(-50%);
  filter:drop-shadow(0 20px 20px rgba(0,0,0,.75));
  animation:idle 1.8s ease-in-out infinite;
  z-index:5;
}

.dancer .head{
  position:absolute;
  width:46px;
  height:46px;
  left:52px;
  top:0;
  border-radius:50%;
  background:linear-gradient(
    145deg,
    #f1c59f,
    #b86f4d
  );
  z-index:5;
}

.dancer .hair{
  position:absolute;
  width:51px;
  height:30px;
  left:50px;
  top:-5px;
  border-radius:50% 50% 20% 20%;
  background:#090b12;
  z-index:6;
}

.dancer .neck{
  position:absolute;
  width:15px;
  height:20px;
  left:67px;
  top:39px;
  background:#c47e5c;
}

.dancer .torso{
  position:absolute;
  width:63px;
  height:92px;
  left:44px;
  top:53px;
  border-radius:18px 18px 12px 12px;
  background:
    linear-gradient(
      135deg,
      var(--cyan),
      var(--blue) 55%,
      var(--purple)
    );
  box-shadow:
    inset 0 0 15px rgba(255,255,255,.25),
    0 0 20px rgba(80,150,255,.22);
}

.dancer .torso:after{
  content:"WOD";
  position:absolute;
  left:0;
  right:0;
  top:35px;
  text-align:center;
  font-size:10px;
  font-weight:1000;
  letter-spacing:1px;
}

.dancer .arm{
  position:absolute;
  width:17px;
  height:96px;
  top:57px;
  border-radius:20px;
  background:linear-gradient(
    #d99b76,
    #a96348
  );
  transform-origin:top center;
}

.dancer .armL{
  left:30px;
  transform:rotate(25deg);
}

.dancer .armR{
  left:104px;
  transform:rotate(-25deg);
}

.dancer .hand{
  position:absolute;
  width:19px;
  height:19px;
  bottom:-7px;
  left:-1px;
  border-radius:50%;
  background:#bd7858;
}

.dancer .leg{
  position:absolute;
  width:23px;
  height:108px;
  top:140px;
  border-radius:14px;
  background:linear-gradient(
    #282d4c,
    #0d101d
  );
  transform-origin:top center;
}

.dancer .legL{
  left:50px;
  transform:rotate(8deg);
}

.dancer .legR{
  left:78px;
  transform:rotate(-8deg);
}

.dancer .shoe{
  position:absolute;
  width:43px;
  height:16px;
  bottom:-7px;
  border-radius:15px;
  background:#f1f7ff;
  box-shadow:0 0 10px rgba(255,255,255,.4);
}

.dancer .legL .shoe{
  left:-17px;
}

.dancer .legR .shoe{
  left:-4px;
}

.dancer.performance{
  animation:performanceBody .4s ease-in-out infinite alternate;
}

.dancer.performance .armL{
  animation:armOne .38s infinite alternate;
}

.dancer.performance .armR{
  animation:armTwo .38s infinite alternate;
}

.dancer.performance .legL{
  animation:legOne .38s infinite alternate;
}

.dancer.performance .legR{
  animation:legTwo .38s infinite alternate;
}

@keyframes idle{
  0%,100%{
    transform:translateX(-50%) translateY(0);
  }
  50%{
    transform:translateX(-50%) translateY(-5px);
  }
}

@keyframes performanceBody{
  from{
    transform:translateX(-50%) translateY(0) rotate(-3deg);
  }
  to{
    transform:translateX(-50%) translateY(-16px) rotate(3deg);
  }
}

@keyframes armOne{
  from{transform:rotate(30deg)}
  to{transform:rotate(-80deg)}
}

@keyframes armTwo{
  from{transform:rotate(-30deg)}
  to{transform:rotate(80deg)}
}

@keyframes legOne{
  from{transform:rotate(10deg)}
  to{transform:rotate(-25deg)}
}

@keyframes legTwo{
  from{transform:rotate(-10deg)}
  to{transform:rotate(25deg)}
}

/* =====================================================
   PLAYER CARD
===================================================== */

.playerCard{
  position:absolute;
  left:18px;
  top:48px;
  z-index:15;
  width:205px;
  padding:12px;
  border-radius:13px;
  background:rgba(6,9,21,.72);
  border:1px solid var(--line);
  backdrop-filter:blur(7px);
}

.playerTop{
  display:flex;
  align-items:center;
  gap:10px;
}

.avatar{
  width:43px;
  height:43px;
  display:grid;
  place-items:center;
  border-radius:12px;
  background:linear-gradient(
    135deg,
    #3478ff,
    #8d43ff
  );
  font-size:20px;
  font-weight:900;
}

.playerName{
  font-size:13px;
  font-weight:900;
}

.playerTitle{
  color:var(--muted);
  font-size:9px;
  margin-top:3px;
}

.xpTrack{
  height:5px;
  margin-top:10px;
  border-radius:10px;
  overflow:hidden;
  background:#20253b;
}

.xpTrack div{
  height:100%;
  background:linear-gradient(
    90deg,
    var(--cyan),
    var(--purple)
  );
}

/* =====================================================
   RATING
===================================================== */

.rating{
  position:absolute;
  right:18px;
  top:48px;
  width:145px;
  z-index:15;
  text-align:right;
}

.rating small{
  color:var(--muted);
  font-size:9px;
}

.rating strong{
  display:block;
  font-size:35px;
  line-height:38px;
  text-shadow:0 0 20px rgba(70,220,255,.5);
}

.ratingBar{
  height:6px;
  border-radius:10px;
  background:#1c2339;
  overflow:hidden;
}

.ratingBar div{
  height:100%;
  background:linear-gradient(
    90deg,
    var(--blue),
    var(--cyan),
    var(--green)
  );
}

/* =====================================================
   QUICK ACTIONS
===================================================== */

.quick{
  position:absolute;
  left:18px;
  bottom:18px;
  z-index:15;
  display:flex;
  gap:8px;
}

.quick button{
  padding:9px 12px;
  border-radius:10px;
  background:rgba(5,8,18,.8);
  border:1px solid var(--line);
  font-size:9px;
  font-weight:900;
}

/* =====================================================
   NAVIGATION
===================================================== */

.bottomNav{
  position:absolute;
  z-index:40;
  left:0;
  right:0;
  bottom:0;
  height:105px;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:7px;
  padding:10px;
  background:
    linear-gradient(
      0deg,
      rgba(2,3,8,.99),
      rgba(5,7,16,.88)
    );
  border-top:1px solid var(--line);
}

.navBtn{
  flex:1;
  max-width:135px;
  height:72px;
  border-radius:13px;
  background:linear-gradient(
    145deg,
    #151a30,
    #0a0d19
  );
  border:1px solid var(--line);
  font-size:9px;
  font-weight:900;
}

.navBtn .icon{
  display:block;
  font-size:19px;
  margin-bottom:5px;
}

.navBtn.active{
  background:linear-gradient(
    135deg,
    #2858d8,
    #6935c9
  );
  box-shadow:0 0 20px rgba(70,100,255,.25);
}

/* =====================================================
   MODAL
===================================================== */

.modal{
  position:absolute;
  z-index:100;
  inset:0;
  display:none;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:rgba(0,0,0,.76);
  backdrop-filter:blur(9px);
}

.modal.show{
  display:flex;
}

.panel{
  width:min(760px,94vw);
  max-height:88vh;
  overflow:auto;
  padding:22px;
  border-radius:20px;
  background:
    linear-gradient(
      145deg,
      #151b34,
      #080a15
    );
  border:1px solid rgba(255,255,255,.15);
  box-shadow:0 30px 100px rgba(0,0,0,.8);
}

.panelHeader{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:18px;
}

.panel h2{
  margin:0;
  font-size:24px;
}

.closeX{
  width:35px;
  height:35px;
  border-radius:10px;
  background:#171d31;
}

.grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
}

.card{
  min-height:92px;
  padding:14px;
  border-radius:13px;
  background:#0b1020;
  border:1px solid var(--line);
}

.card.clickable{
  cursor:pointer;
}

.card.selected{
  border-color:var(--cyan);
  box-shadow:0 0 18px rgba(72,221,255,.16);
  background:#101b34;
}

.card.locked{
  opacity:.5;
}

.card h3{
  margin:0 0 6px;
  font-size:13px;
}

.card p{
  margin:0;
  color:var(--muted);
  font-size:10px;
  line-height:1.4;
}

.primary{
  background:linear-gradient(
    135deg,
    #316cff,
    #8240e9
  );
}

.green{
  background:linear-gradient(
    135deg,
    #119e75,
    #26d19f
  );
}

.gold{
  background:linear-gradient(
    135deg,
    #a9650e,
    #e6a52e
  );
}

.action{
  width:100%;
  padding:13px;
  border-radius:11px;
  margin-top:13px;
  font-weight:900;
  font-size:11px;
}

.statGrid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
  margin:15px 0;
}

.miniStat{
  text-align:center;
  padding:11px 5px;
  border-radius:10px;
  background:#0a0f20;
  border:1px solid var(--line);
}

.miniStat b{
  display:block;
  font-size:18px;
}

.miniStat span{
  color:var(--muted);
  font-size:8px;
}

.skill{
  margin:12px 0;
}

.skillLine{
  display:flex;
  justify-content:space-between;
  font-size:10px;
  margin-bottom:5px;
}

.bar{
  height:7px;
  border-radius:10px;
  background:#1c2338;
  overflow:hidden;
}

.bar div{
  height:100%;
  background:linear-gradient(
    90deg,
    var(--blue),
    var(--cyan)
  );
}

/* =====================================================
   PERFORMANCE OVERLAY
===================================================== */

.performanceHud{
  position:absolute;
  z-index:80;
  inset:0;
  display:none;
  pointer-events:none;
}

.performanceHud.active{
  display:block;
}

.countdown{
  position:absolute;
  left:50%;
  top:45%;
  transform:translate(-50%,-50%);
  font-size:85px;
  font-weight:1000;
  text-shadow:0 0 35px var(--cyan);
}

.movePrompt{
  position:absolute;
  left:50%;
  bottom:125px;
  transform:translateX(-50%);
  padding:12px 27px;
  border-radius:30px;
  background:rgba(0,0,0,.72);
  border:1px solid rgba(255,255,255,.2);
  font-size:13px;
  font-weight:1000;
  letter-spacing:2px;
  pointer-events:none;
}

.performanceTap{
  position:absolute;
  left:50%;
  bottom:190px;
  transform:translateX(-50%);
  width:150px;
  height:60px;
  border-radius:35px;
  background:rgba(80,210,255,.1);
  border:1px solid rgba(80,210,255,.3);
  pointer-events:auto;
  font-weight:900;
}

/* =====================================================
   TOAST
===================================================== */

.toast{
  position:absolute;
  z-index:200;
  left:50%;
  top:78px;
  transform:translate(-50%,-15px);
  opacity:0;
  padding:10px 17px;
  border-radius:20px;
  background:#10172b;
  border:1px solid var(--line);
  font-size:11px;
  font-weight:800;
  transition:.25s;
  pointer-events:none;
  white-space:nowrap;
}

.toast.show{
  opacity:1;
  transform:translate(-50%,0);
}

/* =====================================================
   MOBILE
===================================================== */

@media(max-width:650px){

  .header{
    height:57px;
    padding:7px 8px;
  }

  .world{
    inset:57px 0 94px;
  }

  .brand{
    font-size:12px;
    letter-spacing:1px;
  }

  .resource{
    min-width:49px;
    padding:4px;
  }

  .resource small{
    font-size:6px;
  }

  .resource strong{
    font-size:10px;
  }

  .playerCard{
    left:7px;
    top:40px;
    width:165px;
    padding:8px;
  }

  .avatar{
    width:35px;
    height:35px;
  }

  .rating{
    right:8px;
    top:40px;
    width:110px;
  }

  .rating strong{
    font-size:28px;
  }

  .dancer{
    transform:translateX(-50%) scale(.78);
    transform-origin:bottom center;
    bottom:12%;
  }

  .quick{
    left:7px;
    bottom:7px;
  }

  .quick button{
    padding:7px;
    font-size:7px;
  }

  .bottomNav{
    height:94px;
    padding:6px;
    gap:4px;
  }

  .navBtn{
    height:67px;
    font-size:7px;
    padding:4px;
  }

  .navBtn .icon{
    font-size:16px;
  }

  .grid{
    grid-template-columns:repeat(2,1fr);
  }

  .statGrid{
    grid-template-columns:repeat(2,1fr);
  }

  .panel{
    padding:15px;
  }
}
</style>
</head>

<body>

<div id="app">

  <div class="skyGlow"></div>

  <div class="city">
    <div class="building" style="height:48%"></div>
    <div class="building" style="height:72%"></div>
    <div class="building" style="height:55%"></div>
    <div class="building" style="height:88%"></div>
    <div class="building" style="height:62%"></div>
    <div class="building" style="height:42%"></div>
    <div class="building" style="height:76%"></div>
    <div class="building" style="height:51%"></div>
    <div class="building" style="height:68%"></div>
    <div class="building" style="height:45%"></div>
    <div class="building" style="height:82%"></div>
    <div class="building" style="height:57%"></div>
  </div>

  <div class="stage"></div>
  <div class="stageGlow"></div>

  <!-- HEADER -->

  <header class="header">

    <div class="brand">
      WORLD <i>OF</i> DANCE
    </div>

    <div class="resources">

      <div class="resource">
        <small>LEVEL</small>
        <strong id="level">1</strong>
      </div>

      <div class="resource">
        <small>XP</small>
        <strong id="xp">0</strong>
      </div>

      <div class="resource">
        <small>COINS</small>
        <strong id="coins">500</strong>
      </div>

      <div class="resource">
        <small>ENERGY</small>
        <strong id="energy">100</strong>
      </div>

    </div>

  </header>

  <!-- WORLD -->

  <main class="world">

    <div class="location">
      CITY CENTER · <span id="locationName">DANCE DISTRICT</span>
    </div>

    <!-- PLAYER CARD -->

    <section class="playerCard">

      <div class="playerTop">

        <div class="avatar">W</div>

        <div>
          <div class="playerName" id="playerName">
            RISING DANCER
          </div>

          <div class="playerTitle" id="playerTitle">
            Street Performer
          </div>
        </div>

      </div>

      <div class="xpTrack">
        <div id="xpBar"></div>
      </div>

    </section>

    <!-- RATING -->

    <section class="rating">

      <small>OVERALL RATING</small>

      <strong id="rating">
        68
      </strong>

      <div class="ratingBar">
        <div id="ratingBar"></div>
      </div>

    </section>

    <!-- DANCER -->

    <div class="dancer" id="dancer">

      <div class="hair"></div>
      <div class="head"></div>
      <div class="neck"></div>
      <div class="torso"></div>

      <div class="arm armL">
        <div class="hand"></div>
      </div>

      <div class="arm armR">
        <div class="hand"></div>
      </div>

      <div class="leg legL">
        <div class="shoe"></div>
      </div>

      <div class="leg legR">
        <div class="shoe"></div>
      </div>

    </div>

    <!-- QUICK ACTIONS -->

    <div class="quick">

      <button onclick="openMissions()">
        MISSIONS
      </button>

      <button onclick="openProfile()">
        PROFILE
      </button>

      <button onclick="resetGame()">
        RESET SAVE
      </button>

    </div>

  </main>

  <!-- NAV -->

  <nav class="bottomNav">

    <button
      class="navBtn active"
      id="navHome"
      onclick="showHome()">

      <span class="icon">HOME</span>
      WORLD

    </button>

    <button
      class="navBtn"
      onclick="openTraining()">

      <span class="icon">TRAIN</span>
      TRAINING

    </button>

    <button

/* =====================================================

===================================================== */

const DEFAULT_GAME = {

  level:1,
  xp:0,
  coins:500,
  energy:100,

  dancerName:"RISING DANCER",
  title:"Street Performer",

  dance:"Hip Hop",
  costume:"Street",

  rating:68,

  skills:{
    power:10,
    rhythm:10,
    technique:10,
    style:10,
    stamina:10
  },

  missions:{
    train:0,
    perform:0,
    dances:0
  },

  unlocked:{
    HipHop:true,
    Afro:true,
    Contemporary:true,
    Popping:false,
    Locking:false,
    House:false,

    Street:true,
    Neon:false,
    Champion:false,
    Classic:false,
    Fusion:false
  }

};

let game = loadGame();

function loadGame(){

  try{

    const saved =
      JSON.parse(
        localStorage.getItem("WOD_MASTER_SAVE")
      );

    if(saved){

      return merge(
        structuredClone(DEFAULT_GAME),
        saved
      );

    }

  }catch(e){

    console.log("Save recovery");

  }

  return structuredClone(DEFAULT_GAME);
}

function merge(base,saved){

  Object.keys(saved).forEach(key=>{

    if(
      saved[key] &&
      typeof saved[key]==="object" &&
      !Array.isArray(saved[key]) &&
      base[key]
    ){

      Object.assign(
        base[key],
        saved[key]
      );

    }else{

      base[key]=saved[key];

    }

  });

  return base;
}

function save(){

  localStorage.setItem(
    "WOD_MASTER_SAVE",
    JSON.stringify(game)
  );

}


/* =====================================================
   GENERAL UI
===================================================== */

function updateUI(){

  $("level").textContent=game.level;
  $("xp").textContent=game.xp;
  $("coins").textContent=game.coins;
  $("energy").textContent=game.energy;

  $("rating").textContent=game.rating;
  $("ratingBar").style.width=
    Math.min(100,game.rating)+"%";

  const needed=game.level*100;

  $("xpBar").style.width=
    Math.min(
      100,
      game.xp/needed*100
    )+"%";

  $("playerName").textContent=
    game.dancerName;

  $("playerTitle").textContent=
    game.title;

  $("locationName").textContent=
    game.dance.toUpperCase();

}

function $(id){

  return document.getElementById(id);

}

function closeModal(){

  $("modal").classList.remove("show");

}

function modal(title,html){

  $("panelTitle").textContent=title;
  $("panelContent").innerHTML=html;

  $("modal").classList.add("show");

}

let toastTimer;

function toast(message){

  const t=$("toast");

  t.textContent=message;
  t.classList.add("show");

  clearTimeout(toastTimer);

  toastTimer=setTimeout(
    ()=>t.classList.remove("show"),
    1800

}


/* =====================================================
   HOME
===================================================== */

function showHome(){

/* =====================================================
   SKILL SYSTEM
===================================================== */

function averageSkill(){

  const values=
    Object.values(game.skills);

  return values.reduce(
    (a,b)=>a+b,0
  )/values.length;

}

function recalculateRating(){

  const average=averageSkill();

  game.rating=
    Math.min(
      99,
      Math.round(
        55+
        average*.35+
        game.level*2
      )
    );

}


/* =====================================================
   XP SYSTEM
===================================================== */

function addXP(amount){

  game.xp+=amount;

  let leveled=false;

  while(
    game.xp >= game.level*100
  ){

    game.xp-=game.level*100;

    game.level++;

    game.coins+=100;

    leveled=true;

  }

  if(leveled){

    if(game.level===3)
      game.unlocked.Popping=true;

    if(game.level===5)
      game.unlocked.Locking=true;

    if(game.level===7)
      game.unlocked.House=true;

    toast(
      "LEVEL UP! LEVEL "+
      game.level
    );

  }

}

   TRAINING
===================================================== */

function openTraining(){

  const s=game.skills;

  modal(

}

}

function startTraining(){

    return;

  game.energy-=10;

  const keys=
    Object.keys(game.skills);

    Math.min(
      100,

/* =====================================================
   PERFORMANCE
===================================================== */

let performanceActive=false;
let performanceScore=0;
let performanceMoves=0;
let performanceEndTimer=null;
let countdownTimer=null;

const moves=[
  "LEFT",
  "RIGHT",
  "UP",
  "DOWN",
  "CENTER",
  "POWER"
];

function openPerformance(){

  const bonus=
    Math.round(
      averageSkill()/4
    );

  modal(
    "PERFORMANCE STAGE",

    `

      <div style="text-align:center">

        <div style="
          font-size:13px;
          font-weight:900">

          ${game.dance}

        <div style="
          color:var(--muted);
          margin:8px 0">

          Costume: ${game.costume}

        </div>

      </div>

      <div class="statGrid">

        <div class="miniStat">
          <b>${game.rating}</b>
          <span>RATING</span>
        </div>

        <div class="miniStat">
          <b>+${bonus}</b>
          <span>SKILL BONUS</span>
        </div>

        <div class="miniStat">
          <b>15</b>
          <span>ENERGY</span>
        </div>

        <div class="miniStat">
          <b>LIVE</b>
          <span>STAGE</span>
        </div>

      </div>

      <p style="
        color:var(--muted);
        font-size:10px;
        text-align:center">

        Follow the move prompts and tap
        the stage at the right moments.

      </p>

      <button
        class="action primary"
        onclick="startPerformance()">

        ENTER THE STAGE

      </button>

    `
  );

}

function startPerformance(){

  if(game.energy<15){

    toast(
      "Not enough energy"
    );

    return;

  }

  closeModal();

  game.energy-=15;

  performanceActive=true;
  performanceScore=0;
  performanceMoves=0;

  $("performanceHud")
    .classList.add("active");

  $("dancer")
    .classList.add("performance");

  let count=3;

  $("countdown")
    .textContent=count;

  countdownTimer=
    setInterval(()=>{

      count--;

      if(count<=0){

        clearInterval(
          countdownTimer
        );

        beginPerformance();

      }else{

        $("countdown")
          .textContent=count;

      }

    },800);

}

function beginPerformance(){

  $("countdown")
    .textContent="GO";

  nextMove();

  performanceEndTimer=
    setTimeout(
      finishPerformance,
      15000
    );

}

function nextMove(){

  if(!performanceActive)
    return;

  const move=
    moves[
      Math.floor(
        Math.random()*moves.length
      )
    ];

  performanceMoves++;

  $("movePrompt")
    .textContent=
      move+" · TAP!";

}

$("performanceTap")
  .addEventListener(
    "click",
    hitPerformance
  );

$("app")
  .addEventListener(
    "pointerdown",
    e=>{

      if(!performanceActive)
        return;

      if(
        e.target.closest(".modal") ||
        e.target.closest(".bottomNav")
      )
        return;

      hitPerformance();

    }
  );

function hitPerformance(){

  if(!performanceActive)
    return;

  const accuracy=
    75+
    Math.floor(
      Math.random()*26
    );

  performanceScore+=
    Math.round(
      accuracy/10
    );

  if(performanceScore>100)
    performanceScore=100;

  $("countdown")
    .textContent=
      performanceScore;

  nextMove();

}

function finishPerformance(){

  if(!performanceActive)
    return;

  performanceActive=false;

  clearTimeout(
    performanceEndTimer
  );

  $("performanceHud")
    .classList.remove("active");

  $("dancer")
    .classList.remove("performance");

  const skillBonus=
    Math.round(
      averageSkill()/4
    );

  const costumeBonus=
    game.costume==="Champion"
      ?5
      :game.costume==="Fusion"
        ?7
        :0;

  const finalScore=
    Math.min(
      100,
      Math.round(
        45+
        performanceScore+
        skillBonus+
        costumeBonus
      )
    );

  game.rating=
    Math.max(
      game.rating,
      finalScore
    );

  const coins=
    50+
    finalScore*2;

  const xp=
    40+
    finalScore;

  game.coins+=coins;

  game.missions.perform++;

  addXP(xp);

  recalculateRating();

  save();
  updateUI();

  modal(
    "SHOW COMPLETE",

    `

      <div style="
        text-align:center">

        <div style="
          font-size:80px;
          font-weight:1000;
          text-shadow:
            0 0 30px var(--cyan)">

          ${finalScore}

        </div>

        <div style="
          color:var(--muted);
          font-size:10px">

          FINAL PERFORMANCE SCORE

        </div>

      </div>

      <div class="statGrid">

        <div class="miniStat">
          <b>+${coins}</b>
          <span>COINS</span>
        </div>

        <div class="miniStat">
          <b>+${xp}</b>
          <span>XP</span>
        </div>

        <div class="miniStat">
          <b>${performanceMoves}</b>
          <span>MOVES</span>
        </div>

        <div class="miniStat">
          <b>${game.level}</b>
          <span>LEVEL</span>
        </div>

      </div>

      <button
        class="action primary"
        onclick="closeModal()">

        RETURN TO WORLD

      </button>

    `
  );

}

function beginCompetitionRound(){

    document.getElementById("dancer");

    "performance"
  );

  COMPETITION_DATA.timeLeft=20;

  updateCompetitionHUD();

  nextBattleMove();

  clearInterval(
    COMPETITION_DATA.roundTimer
  );

  clearInterval(
    COMPETITION_DATA.opponentTimer
  );

  COMPETITION_DATA.roundTimer=
    setInterval(()=>{

      COMPETITION_DATA.timeLeft--;

      updateCompetitionHUD();

      if(
        COMPETITION_DATA.timeLeft<=0
      ){

        finishCompetitionRound();

      }

    },1000);

  startOpponentAI();

}


/* =====================================================
   BATTLE MOVE SYSTEM
===================================================== */

const BATTLE_MOVES=[
  "LEFT",
  "RIGHT",
  "UP",
  "DOWN",
  "POWER",
  "STYLE",
  "FREEZE"
];

let currentBattleMove="";

function nextBattleMove(){

  if(!COMPETITION_DATA.active)
    return;

  currentBattleMove=
    BATTLE_MOVES[
      Math.floor(
        Math.random()*
        BATTLE_MOVES.length
      )
    ];

  const el=
    document.getElementById(
      "battleMove"
    );

  if(el){

    el.textContent=
      currentBattleMove+
      " · HIT!";

  }

}


/* =====================================================
   PLAYER MOVE
===================================================== */

function playerBattleMove(){

  if(
    !COMPETITION_DATA.active
  )
    return;

  COMPETITION_DATA.totalMoves++;

  const baseAccuracy=
    70+
    Math.random()*30;

  const accuracy=
    Math.round(
      baseAccuracy
    );

  if(accuracy>=80){

    COMPETITION_DATA.accuracyHits++;

    COMPETITION_DATA.playerCombo++;

    if(
      COMPETITION_DATA.playerCombo >
      COMPETITION_DATA.bestCombo
    ){

      COMPETITION_DATA.bestCombo=
        COMPETITION_DATA.playerCombo;

    }

    let points=
      5+
      Math.floor(
        accuracy/20
      )+
      Math.min(
        8,
        COMPETITION_DATA.playerCombo
      );

    const skillBonus=
      Math.floor(
        averageSkill()/20
      );

    points+=skillBonus;

    COMPETITION_DATA.playerScore+=
      points;

    COMPETITION_DATA.crowd=
      Math.min(
        100,
        COMPETITION_DATA.crowd+
        3+
        Math.min(
          3,
          COMPETITION_DATA.playerCombo
        )
      );

    toast(
      "GREAT! "+
      accuracy+"% · COMBO x"+
      COMPETITION_DATA.playerCombo
    );

  }else{

    COMPETITION_DATA.playerCombo=0;

    COMPETITION_DATA.crowd=
      Math.max(
        0,
        COMPETITION_DATA.crowd-4
      );

    toast(
      "MISSED · COMBO BROKEN"
    );

  }

  updateCompetitionHUD();

  nextBattleMove();

}


/* =====================================================
   OPPONENT AI
===================================================== */

function startOpponentAI(){

  const rival=
    COMPETITION_DATA.opponent;

  const interval=
    Math.max(
      700,
      1450-
      rival.difficulty*120
    );

  COMPETITION_DATA.opponentTimer=
    setInterval(()=>{

      if(
        !COMPETITION_DATA.active
      )
        return;

      const variance=
        Math.random();

      const chance=
        .54+
        rival.difficulty*.055;

      if(variance<chance){

        const points=
          4+
          rival.difficulty+
          Math.floor(
            Math.random()*5
          );

        COMPETITION_DATA.opponentScore+=
          points;

        COMPETITION_DATA.crowd=
          Math.max(
            0,
            COMPETITION_DATA.crowd-1
          );

      }

      updateCompetitionHUD();

    },interval);

}


/* =====================================================
   HUD UPDATE
===================================================== */

function updateCompetitionHUD(){

  const player=
    document.getElementById(
      "battlePlayerScore"
    );

  const opponent=
    document.getElementById(
      "battleOpponentScore"
    );

  const timer=
    document.getElementById(
      "battleTimer"
    );

  const round=
    document.getElementById(
      "battleRound"
    );

  const combo=
    document.getElementById(
      "battleCombo"
    );

  const crowd=
    document.getElementById(
      "crowdBar"
    );

  const playerBar=
    document.getElementById(
      "playerBattleBar"
    );

  const opponentBar=
    document.getElementById(
      "opponentBattleBar"
    );

  if(player)
    player.textContent=
      COMPETITION_DATA.playerScore;

  if(opponent)
    opponent.textContent=
      COMPETITION_DATA.opponentScore;

  if(timer)
    timer.textContent=
      COMPETITION_DATA.timeLeft;

  if(round)
    round.textContent=
      "ROUND "+
      COMPETITION_DATA.round;

  if(combo)
    combo.innerHTML=
      "<small style='color:var(--muted);font-size:8px'>COMBO</small>"+
      "<div style='font-size:31px;font-weight:1000'>x"+
      COMPETITION_DATA.playerCombo+
      "</div>";

  if(crowd)
    crowd.style.width=
      COMPETITION_DATA.crowd+"%";

  const maxScore=
    Math.max(
      1,
      COMPETITION_DATA.playerScore,
      COMPETITION_DATA.opponentScore
    );

  if(playerBar)
    playerBar.style.width=
      (
        COMPETITION_DATA.playerScore/
        maxScore*100
      )+"%";

  if(opponentBar)
    opponentBar.style.width=
      (
        COMPETITION_DATA.opponentScore/
        maxScore*100
      )+"%";

}


/* =====================================================
   END ROUND
===================================================== */

function finishCompetitionRound(){

  clearInterval(
    COMPETITION_DATA.roundTimer
  );

  clearInterval(
    COMPETITION_DATA.opponentTimer
  );

  if(
    COMPETITION_DATA.playerScore >
    COMPETITION_DATA.opponentScore
  ){

    COMPETITION_DATA.roundResult=
      "WIN";

  }else if(
    COMPETITION_DATA.playerScore <
    COMPETITION_DATA.opponentScore
  ){

    COMPETITION_DATA.roundResult=
      "LOSS";

  }else{

    COMPETITION_DATA.roundResult=
      "DRAW";

  }

  if(
    COMPETITION_DATA.round >=
    COMPETITION_DATA.maxRounds
  ){

    finishCompetition();

    return;

  }

  showRoundResult();

}

/* =========================================================
   CREW LEVEL
========================================================= */

function calculateCrewLevel(){

  const required =
    500 +
    (CREW_MODE.level * 500);

  while(
    CREW_MODE.crewXP >= required
  ){

    CREW_MODE.crewXP -= required;

    CREW_MODE.level++;

    CREW_MODE.reputation += 50;

    if(typeof toast === "function"){

      toast(
        "CREW LEVEL UP!"
      );

    }

  }

}


/* =========================================================
   CREW RATING
========================================================= */

function getCrewRating(){

  if(!CREW_MODE.members.length)
    return 0;

  let total = 0;

  CREW_MODE.members.forEach(
    member => {
      total += member.rating;
    }
  );

  return Math.round(
    total /
    CREW_MODE.members.length
  );

}

   CREW POWER
========================================================= */

function getCrewPower(){

  if(!CREW_MODE.members.length)
    return 0;

  let power = 0;

  CREW_MODE.members.forEach(
    member => {

      power +=
        member.rating *
        (member.morale / 100) *
        (member.energy / 100);

    }
  );

  return Math.round(power);

}

/* =========================================================

========================================================= */

function recruitCrewMember(index){

  const candidate =
    CREW_MODE.roster[index];

  if(!candidate)
    return;

  if(
    CREW_MODE.members.some(
      m =>
      m.name === candidate.name
    )
  ){

    toast("Already recruited");
    return;

  }


  if(
    typeof game === "undefined" ||
    game.coins < candidate.price
  ){

    toast("Not enough coins");
    return;

  }


  game.coins -=
    candidate.price;


  CREW_MODE.members.push({

    id:
      Date.now(),

    name:
      candidate.name,

    role:
      candidate.role,

    style:
      candidate.style,

    rating:
      candidate.rating,

    energy:
      100,

    morale:
      85,

    unlocked:
      true

  });


  CREW_MODE.reputation += 10;

  saveCrew();

  if(typeof save === "function")
    save();

  if(typeof updateUI === "function")
    updateUI();

  toast(
    candidate.name+
    " joined your crew!"
  );

  openRecruitment();

}

/* =========================================================
   TRAIN CREW MEMBER
========================================================= */

function trainCrewMember(id){

  const member =
    CREW_MODE.members.find(
      m => m.id === id
    );

  if(!member)
    return;


  if(member.energy < 20){

    toast(
      member.name+
      " needs rest"
    );

    return;

  }


  member.energy -= 20;

  member.rating =
    Math.min(
      99,
      member.rating+
      1+
      Math.floor(
        Math.random()*2
      )
    );

  member.morale =
    Math.min(
      100,
      member.morale+2
    );


  CREW_MODE.crewXP += 100;

  calculateCrewLevel();

  saveCrew();

  if(typeof save === "function")
    save();

  toast(
    member.name+
    " improved!"
  );

  openCrewMember(id);

}


/* =========================================================
   REST MEMBER
========================================================= */

function restCrewMember(id){

  const member =
    CREW_MODE.members.find(
      m => m.id === id
    );

  if(!member)
    return;


  member.energy =
    Math.min(
      100,
      member.energy+35
    );

  member.morale =
    Math.min(
      100,
      member.morale+8
    );


  saveCrew();

  toast(
    member.name+
    " is recovering"
  );

  openCrewMember(id);

}

/* =========================================================
   RUN CREW BATTLE
========================================================= */

function runCrewBattle(
  enemyName,
  enemyRating
){

  closeModal();


  let crewPower =
    getCrewPower();


  const moraleBonus =
    CREW_MODE.members.reduce(
      (sum,m) =>
        sum+
        m.morale/100,
      0
    )*5;


  crewPower +=
    Math.round(
      moraleBonus
    );


  const enemyPower =
    enemyRating *
    CREW_MODE.members.length;


  const playerRoll =
    crewPower+
    Math.floor(
      Math.random()*80
    );


  const enemyRoll =
    enemyPower+
    Math.floor(
      Math.random()*80
    );


  let result;

  if(playerRoll>enemyRoll)
    result="WIN";
  else if(playerRoll<enemyRoll)
    result="LOSS";
  else
    result="DRAW";


  let xp=0;
  let coins=0;


  if(result==="WIN"){

    xp=300;
    coins=700;

    CREW_MODE.reputation+=50;

  }

  else if(result==="DRAW"){

    xp=150;
    coins=250;

    CREW_MODE.reputation+=15;

  }

  else{

    xp=80;
    coins=100;

  }


  CREW_MODE.crewXP += xp;


  CREW_MODE.members.forEach(
    member => {

      member.energy =
        Math.max(
          0,
          member.energy-25
        );

      if(result==="WIN"){

        member.morale =
          Math.min(
            100,
            member.morale+8
          );

      }else{

        member.morale =
          Math.max(
            0,
            member.morale-3
          );

      }

    }
  );


  calculateCrewLevel();


  if(
    typeof game !== "undefined"
  ){

    game.coins += coins;

  }


  saveCrew();


  if(typeof save === "function")
    save();

  if(typeof updateUI === "function")
    updateUI();


  modal(

    result==="WIN"
      ? "CREW VICTORY"
      : result==="DRAW"
        ? "CREW DRAW"
        : "CREW DEFEAT",

    `

      <div style="text-align:center">

        <div style="
          font-size:48px;
          font-weight:1000">

          ${result}

        </div>

        <div style="
          margin:10px;
          font-size:20px">

          ${Math.round(playerRoll)}
          -
          ${Math.round(enemyRoll)}

        </div>


        <div class="statGrid">

          <div class="miniStat">

            <b>
              +${coins}
            </b>

            <span>
              COINS
            </span>

          </div>

          <div class="miniStat">

            <b>
              +${xp}
            </b>

            <span>
              CREW XP
            </span>

          </div>

          <div class="miniStat">

            <b>
              ${CREW_MODE.level}
            </b>

            <span>
              CREW LEVEL
            </span>

          </div>

          <div class="miniStat">

            <b>
              ${CREW_MODE.reputation}
            </b>

            <span>
              REP
            </span>

          </div>

        </div>


        <button
          class="action primary"
          onclick="openCrew()">

          CREW HQ

        </button>

      </div>

    `
  );

}

  function createOptionGroup(
    label,
    type

    const current =

    let buttons="";


    options.forEach(
      option => {

        const selected =
          option===current;


        buttons += `

          <button
            class="
              characterOption
              ${selected
                ? "selected"
                : ""}
            "
            onclick="
              selectCharacterOption(
                '${type}',
                '${option}'
              )
            ">

            ${option}

          </button>

    );

      DANCE_PERFORMANCE.beatTimer

    DANCE_PERFORMANCE.beatTimer=
      setInterval(
        ()=>{

          if(
            !DANCE_PERFORMANCE.active
          )
            return;


          position +=
            direction*7;


          if(position>=100){

            position=100;

            direction=-1;

          }


          if(position<=0){

            position=0;

            direction=1;

          }


          const marker =
            document.getElementById(
              "dpTimingMarker"

          if(marker){

            marker.style.left=

  function(direction){

      DANCE_PERFORMANCE.stamina<=0
    ){

      finishPerformance();

      return;

    const marker =
      document.getElementById(
        "dpTimingMarker"
      );


    let position=50;


    if(marker){

      position =
        parseFloat(
          marker.style.left
        ) || 50;

    }


    const distance =
      Math.abs(
        position-50
      );


    let result;

    let points=0;


    if(distance<=7){

      result="PERFECT";

      points=100;

      DANCE_PERFORMANCE.perfects++;

      DANCE_PERFORMANCE.greats++;

    }

    else if(distance<=17){

      result="GREAT";

      points=70;

      DANCE_PERFORMANCE.greats++;

    }

    else if(distance<=30){

      result="GOOD";

      points=40;

      DANCE_PERFORMANCE.goods++;

      points=0;

      DANCE_PERFORMANCE.misses++;

        );


      points =

          points*multiplier

      DANCE_PERFORMANCE.score +=
        points;


      DANCE_PERFORMANCE.stamina -=
        result==="PERFECT"
          ? 3
          : 4;

      DANCE_PERFORMANCE.combo=0;

      DANCE_PERFORMANCE.stamina -=
        7;

      result,
      points
    );

    );

    2350,
    3000,

    4800,

    if(level === 8){

    }


    Object.keys(

      skill=>{

  /* =======================================================
     TIER SYSTEM
  ======================================================= */

  function updateCareerTier(){

    const reputation =
      CAREER_SYSTEM.reputation;


    let tier =
      "ROOKIE";


    if(reputation >= 100)
      tier = "RISING STAR";


    if(reputation >= 250)
      tier = "PRO";


    if(reputation >= 500)
      tier = "ELITE";


    if(reputation >= 900)
      tier = "MASTER";


    if(reputation >= 1500)
      tier = "LEGEND";


    CAREER_SYSTEM.tier =
      tier;

  }


  /* =======================================================
     REGISTER PERFORMANCE
  ======================================================= */

  window.registerCareerPerformance =
  function(){

    if(
      !window.DANCE_PERFORMANCE
    )
      return;


    const performance =
      DANCE_PERFORMANCE;


    const score =
      Number(
        performance.score || 0
      );


    const combo =
      Number(
        performance.maxCombo || 0
      );


    const moves =
      Number(
        performance.moves?.length || 1
      );


    const hits =
      Number(
        performance.hits || 0
      );


    const accuracy =
      Math.round(
        (hits / moves) * 100
      );


    CAREER_SYSTEM.performances++;


    CAREER_SYSTEM.bestScore =
      Math.max(
        CAREER_SYSTEM.bestScore,
        score
      );


    CAREER_SYSTEM.bestCombo =
      Math.max(
        CAREER_SYSTEM.bestCombo,
        combo
      );


    let xp =
      Math.max(
        20,
        Math.round(score / 10)
      );


    let reputation =
      Math.max(
        5,
        Math.round(score / 30)
      );


    if(accuracy >= 90){

      xp += 20;
      reputation += 15;

    }
    else if(accuracy >= 75){

      xp += 10;
      reputation += 8;

    }


    if(combo >= 10){

      xp += 10;

    }


    CAREER_SYSTEM.reputation +=
      reputation;


    addCareerXP(xp);


    improveSkills(
      performance.style,
      accuracy
    );


    checkMilestones();


    saveCareer();

  };

    style,
    accuracy

    const increase =
      accuracy >= 90

        : accuracy >= 75
          ? 2
          : 1;


    CAREER_SYSTEM.skills.rhythm =
      Math.min(
        99,
        CAREER_SYSTEM.skills.rhythm +
        increase
      );


    CAREER_SYSTEM.skills.performance =
      Math.min(
        99,
        CAREER_SYSTEM.skills.performance +
        increase
      );


    if(style === "Popping"){

      CAREER_SYSTEM.skills.technique =
        Math.min(
          99,
          CAREER_SYSTEM.skills.technique +
          increase
        );

    }


    if(style === "Hip Hop"){

      CAREER_SYSTEM.skills.freestyle =
        Math.min(
          99,
          CAREER_SYSTEM.skills.freestyle +
          increase
        );

    }


    if(style === "Afro"){

      CAREER_SYSTEM.skills.stamina =
        Math.min(
          99,
          CAREER_SYSTEM.skills.stamina +
          increase
        );

    }

  }

  /* =======================================================
     START TRAINING
  ======================================================= */

  function startTraining(){

    if(
      !TRAINING_SYSTEM.active
    )
      return;


    showTrainingMove();


    startTrainingBeat();


    clearInterval(
      TRAINING_SYSTEM.timer
    );


    TRAINING_SYSTEM.timer =
      setInterval(
        ()=>{

          TRAINING_SYSTEM.timeLeft--;


          const timer =
            document.getElementById(
              "trainingTimer"
            );


          if(timer){

            timer.textContent=
              Math.max(
                0,
                TRAINING_SYSTEM.timeLeft
              );

          }


          if(
            TRAINING_SYSTEM.timeLeft <= 0
          ){

            finishTraining();

          }

        },
        1000
      );

  }


  /* =======================================================
     SHOW MOVE
  ======================================================= */

  function showTrainingMove(){

    const element =
      document.getElementById(
        "trainingMove"
      );


    if(!element)
      return;


    const move =
      TRAINING_SYSTEM.moves[
        TRAINING_SYSTEM.moveIndex
      ];


    if(!move){

      finishTraining();

      return;

    }


    element.textContent=
      move;


    element.classList.remove(
      "trainingMovePop"
    );


    void element.offsetWidth;


    element.classList.add(
      "trainingMovePop"
    );

  }


  /* =======================================================
     BEAT
  ======================================================= */

  function startTrainingBeat(){

    clearInterval(
      TRAINING_SYSTEM.beatTimer
    );


    let position=0;

    let direction=1;


    TRAINING_SYSTEM.beatTimer =
      setInterval(
        ()=>{

          if(
            !TRAINING_SYSTEM.active
          )
            return;


          position +=
            direction * 8;


          if(position >= 100){

            position=100;
            direction=-1;

          }


          if(position <= 0){

            position=0;
            direction=1;

          }


          const marker =
            document.getElementById(
              "trainingMarker"
            );


          if(marker){

            marker.style.left=
              position+"%";

          }

        },
        80
      );

  }


  /* =======================================================
     HIT TRAINING MOVE
  ======================================================= */

  window.hitTrainingMove =
  function(){

    if(
      !TRAINING_SYSTEM.active ||
      TRAINING_SYSTEM.finished
    )
      return;


    const marker =
      document.getElementById(
        "trainingMarker"
      );


    const position =
      marker
        ? parseFloat(
            marker.style.left
          ) || 50
        : 50;


    const distance =
      Math.abs(
        position - 50
      );


    let result;
    let points;


    if(distance <= 7){

      result="PERFECT";
      points=100;

    }
    else if(distance <= 17){

      result="GREAT";
      points=70;

    }
    else if(distance <= 30){

      result="GOOD";
      points=40;

    }
    else{

      result="MISS";
      points=0;

    }


    if(result === "MISS"){

      TRAINING_SYSTEM.combo=0;

      TRAINING_SYSTEM.missedMoves++;

    }
    else{

      TRAINING_SYSTEM.successfulMoves++;

      TRAINING_SYSTEM.combo++;


      TRAINING_SYSTEM.maxCombo=
        Math.max(
          TRAINING_SYSTEM.maxCombo,
          TRAINING_SYSTEM.combo
        );


      const multiplier =
        Math.min(
          3,
          1 +
          Math.floor(
            TRAINING_SYSTEM.combo / 5
          ) * .5
        );


      points =
        Math.round(
          points * multiplier
        );


      TRAINING_SYSTEM.score +=
        points;

    }


    showTrainingFeedback(
      result,
      points
    );


    animateTrainingDancer(
      result
    );


    updateTrainingStats();


    TRAINING_SYSTEM.moveIndex++;


    setTimeout(
      showTrainingMove,
      250
    );

  };


  /* =======================================================
     FEEDBACK
  ======================================================= */

  function showTrainingFeedback(
    result,
    points
  ){

    const element =
      document.getElementById(
        "trainingFeedback"
      );


    if(!element)
      return;


    element.textContent =
      result +
      (
        points
          ? "  +" + points
          : ""
      );


    element.className =
      "trainingFeedback-" +
      result.toLowerCase();


    element.classList.remove(
      "trainingFeedbackPop"
    );


    void element.offsetWidth;


    element.classList.add(
      "trainingFeedbackPop"
    );

  }


  /* =======================================================
     UPDATE STATS
  ======================================================= */

  function updateTrainingStats(){

    const score =
      document.getElementById(
        "trainingScore"
      );


    const combo =
      document.getElementById(
        "trainingCombo"
      );


    const moves =
      document.getElementById(
        "trainingMoves"
      );


    if(score)
      score.textContent=
        TRAINING_SYSTEM.score;


    if(combo)
      combo.textContent=
        TRAINING_SYSTEM.combo;


    if(moves)
      moves.textContent=
        TRAINING_SYSTEM.successfulMoves;

  }


  /* =======================================================
     DANCER ANIMATION
  ======================================================= */

  function animateTrainingDancer(
    result
  ){

    const dancer =
      document.querySelector(
        ".trainingBody"
      );


    if(!dancer)
      return;


    dancer.classList.remove(
      "trainingDance",
      "trainingPerfect",
      "trainingMiss"
    );


    void dancer.offsetWidth;


    dancer.classList.add(
      "trainingDance"
    );


    if(result === "PERFECT"){

      dancer.classList.add(
        "trainingPerfect"
      );

    }


    if(result === "MISS"){

      dancer.classList.add(
        "trainingMiss"
      );

    }

  }


  /* =======================================================
     FINISH TRAINING
  ======================================================= */

  function finishTraining(){

    if(
      TRAINING_SYSTEM.finished
    )
      return;


    TRAINING_SYSTEM.finished=true;

    TRAINING_SYSTEM.active=false;


    clearInterval(
      TRAINING_SYSTEM.timer
    );

    clearInterval(
      TRAINING_SYSTEM.beatTimer
    );


    const total =
      TRAINING_SYSTEM.successfulMoves +
      TRAINING_SYSTEM.missedMoves;


    const accuracy =
      total
        ? Math.round(
            (
              TRAINING_SYSTEM.successfulMoves /
              total
            ) * 100
          )
        : 0;


    let trainingXP =
      Math.max(
        5,
        Math.round(
          TRAINING_SYSTEM.score / 15
        )
      );


    if(accuracy >= 90)
      trainingXP += 10;


    if(
      TRAINING_SYSTEM.maxCombo >= 10
    )
      trainingXP += 5;


    improveTrainingSkill(
      TRAINING_SYSTEM.selectedSkill,
      accuracy
    );


    if(
      window.addCareerXP
    ){

      addCareerXP(
        trainingXP
      );

    }


    saveTraining();


    setTimeout(
      ()=>{

        modal(

          "TRAINING COMPLETE",

          `

            <div
              class="trainingResult">

              <div
                class="trainingResultGrade">

                ${
                  accuracy >= 90
                    ? "A"
                    : accuracy >= 75
                      ? "B"
                      : accuracy >= 60
                        ? "C"
                        : "D"
                }

              </div>


              <h2>

                ${
                  TRAINING_DATABASE[
                    TRAINING_SYSTEM.selectedSkill
                  ].title
                }

              </h2>


              <div
                class="trainingResultGrid">

                <div>

                  <b>
                    ${TRAINING_SYSTEM.score}
                  </b>

                  <span>
                    SCORE
                  </span>

                </div>


                <div>

                  <b>
                    ${accuracy}%
                  </b>

                  <span>
                    ACCURACY
                  </span>

                </div>


                <div>

                  <b>
                    ${TRAINING_SYSTEM.maxCombo}
                  </b>

                  <span>
                    MAX COMBO
                  </span>

                </div>


                <div>

                  <b>
                    +${trainingXP}
                  </b>

                  <span>
                    XP
                  </span>

                </div>

              </div>


              <button
                class="action primary"
                style="
                  width:100%;
                  margin-top:12px;
                "
                onclick="
                  closeModal();
                  openTrainingCenter();
                ">

                TRAIN AGAIN

              </button>

            </div>

          `

        );

      },
      400
    );

  }


  /* =======================================================
     IMPROVE CAREER SKILL
  ======================================================= */

  function improveTrainingSkill(
    skill,
    accuracy
  ){

    if(
      !window.CAREER_SYSTEM
    )
      return;


    let increase=1;


    if(accuracy >= 90)
      increase=3;

    else if(accuracy >= 75)
      increase=2;


    CAREER_SYSTEM.skills[skill] =
      Math.min(
        99,
        (
          CAREER_SYSTEM.skills[skill] ||
          50
        ) + increase
      );


    if(
      typeof saveCareer ===
      "function"
    ){

      saveCareer();

    }
    else{

      localStorage.setItem(
        "WORLD_DANCE_CAREER",
        JSON.stringify(
          CAREER_SYSTEM
        )
      );

    }

  }


  /* =======================================================
     SAVE TRAINING
  ======================================================= */

  function saveTraining(){

    localStorage.setItem(
      "WORLD_DANCE_TRAINING",
      JSON.stringify({
        lastSkill:
          TRAINING_SYSTEM.selectedSkill,
        lastScore:
          TRAINING_SYSTEM.score,
        lastAccuracy:
          TRAINING_SYSTEM.successfulMoves,
        lastDate:
          new Date().toISOString()
      })
    );

  }

    clearInterval(

  };

  window.recordCompetitionResult =
  function(score){

    const id =
      WORLD_COMPETITION_SYSTEM
        .currentStage;


    if(!id)
      return;


    const competition =
      COMPETITIONS.find(
        item =>

      );

      return;


    score =

    const skill =
      overallSkill();


    /*

      on opponent strength.
    */

    const target =
      competition.requiredSkill *
      18;


    const performanceScore =
      score +

    let result;


    if(

    ){

      result="WIN";

    }
    else if(
      performanceScore >=
      target * .92
    ){

      result="PODIUM";

    }
    else{

      result="LOSS";

    }


    processCompetitionResult(
      competition,
      result,
      score
    );

  /* =======================================================

  ======================================================= */

  function processCompetitionResult(
    competition,
    result,
    score
  ){

    let xp=0;
    let rep=0;


    if(result === "WIN"){

      xp =
        competition.rewardXP;

      rep =
        competition.rewardRep;

      WORLD_COMPETITION_SYSTEM.wins++;

      WORLD_COMPETITION_SYSTEM.podiums++;

    }


    else if(result === "PODIUM"){

      xp =
        Math.round(
          competition.rewardXP * .7
        );

      rep =
        Math.round(
          competition.rewardRep * .7
        );

      WORLD_COMPETITION_SYSTEM.podiums++;

    }


    else{

      xp =
        Math.round(
          competition.rewardXP * .3
        );

      rep =
        Math.round(
          competition.rewardRep * .2
        );

    }


    if(
      !WORLD_COMPETITION_SYSTEM
        .completed
        .includes(
          competition.id

        .completed
        .push(

  /* =======================================================
     TIMING
  ======================================================= */

  function startTiming(){

    const p =
      WOD_PERFORMANCE_V12;


    let position=0;

    let direction=1;


    clearInterval(
      p.beatTimer
    );


    const speed =
      Math.max(
        35,
        Math.round(
          60000 /
          p.selectedSong.bpm /
          2
        )
      );


    p.beatTimer =
      setInterval(
        ()=>{

          if(!p.active)
            return;


          position +=
            direction * 6;


          if(position >= 100){

            position=100;

            direction=-1;

          }


          if(position <= 0){

            position=0;

            direction=1;

          }


          const marker =
            document.getElementById(
              "v12TimingMarker"
            );


          if(marker){

            marker.style.left =
              position+"%";

          }

        },
        speed
      );

  }


  /* =======================================================
     PERFORM MOVE
  ======================================================= */

  window.performMove =
  function(){

    const p =
      WOD_PERFORMANCE_V12;


    if(
      !p.active ||
      p.finished
    )
      return;


    const marker =
      document.getElementById(
        "v12TimingMarker"
      );


    const position =
      marker
        ? parseFloat(
            marker.style.left
          ) || 50
        : 50;


    const distance =
      Math.abs(
        position - 50
      );


    let result;

    let points;


    if(distance <= 7){

      result="PERFECT";

      points=100;

      p.perfect++;

    }

    else if(distance <= 17){

      result="GREAT";

      points=75;

      p.great++;

    }

    else if(distance <= 31){

      result="GOOD";

      points=45;

      p.good++;

    }

    else{

      result="MISS";

      points=0;

      p.miss++;

    }


    if(result === "MISS"){

      p.combo=0;

      changeCrowd(-4);

    }

    else{

      p.combo++;


      p.maxCombo =
        Math.max(
          p.maxCombo,
          p.combo
        );


      const multiplier =
        Math.min(
          3,
          1 +
          Math.floor(
            p.combo / 5
          ) * .25
        );


      points =
        Math.round(
          points *
          multiplier
        );


      /*
        Training skill affects
        performance quality.

      points +=
        Math.round(
          getPerformanceBonus()
        );


      p.score +=
        points;


      if(result === "PERFECT")
        changeCrowd(3);

      else if(result === "GREAT")
        changeCrowd(2);

      else
        changeCrowd(1);

    showPerformanceFeedback(

  function updateJudges(

    const base =

    let technique =
      base.technique || 50;


    let rhythm =
      base.rhythm || 50;


    let performance =
      base.performance || 50;


    if(result === "PERFECT"){

      technique += 8;

      rhythm += 8;

      performance += 7;

    }

    else if(result === "GREAT"){

      technique += 5;

      rhythm += 5;

      performance += 4;

    }

    else if(result === "GOOD"){

      technique += 2;

      rhythm += 2;

      performance += 2;

    }

    const r =

    const s =

      t.textContent =

    if(r)
      r.textContent =

          99,

  /* =======================================================
     FINISH
  ======================================================= */

  function finishPerformance(){

    const p =
      WOD_PERFORMANCE_V12;


    if(p.finished)
      return;


    p.finished=true;

    p.active=false;


    clearInterval(
      p.timer
    );

    clearInterval(
      p.beatTimer
    );


    const total =
      p.perfect +
      p.great +
      p.good +
      p.miss;


    const accuracy =
      total
        ? Math.round(
            (
              (
                p.perfect +
                p.great +
                p.good
              ) /
              total
            ) * 100
          )
        : 0;


    const finalScore =
      Math.round(
        p.score +
        p.crowd * 5 +
        p.maxCombo * 12
      );


    let grade;


    if(finalScore >= 9000)
      grade="S";

    else if(finalScore >= 7500)
      grade="A";

    else if(finalScore >= 6000)
      grade="B";

    else if(finalScore >= 4500)
      grade="C";

    else
      grade="D";


    /*
      If this performance came
      from a competition, send
      the score into BUILD 11.
    */

    const competition =
      p.competition;


    if(
      competition &&
      typeof window.recordCompetitionResult ===
      "function"
    ){

      setTimeout(
        ()=>{

          recordCompetitionResult(
            finalScore
          );

        },
        300
      );

      return;

    }


    const xp =
      Math.max(
        25,
        Math.round(
          finalScore / 30
        )
      );


    if(
      typeof window.addCareerXP ===
      "function"
    ){

      addCareerXP(xp);

    }


    showPerformanceResult(
      finalScore,
      accuracy,
      grade,
      xp
    );

  }

  /* =======================================================

  ======================================================= */

  function getOverallSkill(){

    const skills =
      getCareer().skills;


    const values =
      Object.values(
        skills
      );


    if(!values.length)
      return 50;


    return Math.round(
      values.reduce(
        (a,b)=>a+b,
        0
      ) /
      values.length
    );

  }

/* ---------------------------------------------------------
   LEVEL
--------------------------------------------------------- */

function requiredXP(level){

    return 250 + ((level-1)*175);

}


function addXP(amount){

    const p =
        getPlayerData();

    p.xp += amount;

    let levelled=false;

    while(
        p.xp >= requiredXP(p.level)
    ){

        p.xp -=
            requiredXP(p.level);

        p.level++;

        levelled=true;

    }

    savePlayer();

    return levelled;

}

window.WOD_ADD_XP = addXP;

--------------------------------------------------------- */

window.enterCompetition =
function(){

    const event =
        WOD_COMPETITIONS.selected;

    if(!event) return;

    const p =
        getPlayerData();


    if(p.coins < event.entry){

        showToast(
            "Not enough coins."
        );

        return;

    }


    p.coins -= event.entry;

    savePlayer();

    closeModal();


    setTimeout(
        function(){

            if(
                typeof window.openPerformanceEngine ===
                "function"
            ){

                window.openPerformanceEngine(
                    event
                );

            }else{

                showToast(
                    "Performance Engine not found."
                );

            }

        },
        250
    );

};


/* ---------------------------------------------------------
   COMPETITION RESULT
--------------------------------------------------------- */

window.recordCompetitionResult =
function(score){

    const event =
        WOD_COMPETITIONS.selected;

    if(!event) return;


    const p =
        getPlayerData();


    const difficulty =
        event.difficulty;


    const target =
        2500 +
        (
            difficulty *
            1250
        );


    const won =
        score >= target;


    p.competitions++;


    if(won){

        p.wins++;

        p.coins +=
            event.reward;

        p.reputation +=
            25 *
            difficulty;

        const levelled =
            addXP(
                event.xp
            );


        WOD_COMPETITIONS.completed[
            event.id
        ] = true;


        unlockNextCompetition(
            event
        );


        savePlayer();


        showCompetitionResult(
            event,
            score,
            true,
            levelled
        );

    }else{

        p.losses++;

        p.reputation +=
            5;


        const participationXP =
            Math.round(
                event.xp * .25
            );


        addXP(
            participationXP
        );


        savePlayer();


        showCompetitionResult(
            event,
            score,
            false,
            false
        );

    }

};


/* ---------------------------------------------------------
   UNLOCK NEXT
--------------------------------------------------------- */

function unlockNextCompetition(
    completed
){

    const index =
        WOD_COMPETITIONS.events
            .findIndex(
                e =>
                    e.id ===
                    completed.id
            );


    const next =
        WOD_COMPETITIONS
            .events[index+1];


    if(!next) return;


    if(
        getPlayerData().level >=
        next.requiredLevel
    ){

        getPlayerData()
            .unlocked[next.id] =
            true;

    }

}

function checkAchievements(){

        unlockAchievement(
            "firstWin"
        );

    }


    if(
        p.wins >= 5

            "fiveWins"
        );

    if(
        p.wins >= 10

        unlockAchievement(
            "tenWins"
        );

    }


    if(

        unlockAchievement(

        );

    }

function unlockAchievement(id){

    const p =
        getPlayerData();


    if(!p.achievements)
        p.achievements={};


    if(
        p.achievements[id]
    )
        return;


    const achievement =
        WOD_ACHIEVEMENTS[id];


    if(!achievement)
        return;


    p.achievements[id]=true;

    p.coins +=
        achievement.reward;


    savePlayer();


    setTimeout(
        ()=>{

            showToast(
                "ACHIEVEMENT: " +
                achievement.name +
                " +" +
                achievement.reward
            );

        },
        500
    );

}

/* =========================================================
   PLAYER MOVE
========================================================= */

window.WOD_PERFORM_MOVE = function(moveId){

    if(
        !WOD_MATCH.active ||
        WOD_MATCH.finished
    )
        return;


    const move =
        WOD_MOVES.find(
            m => m.id === moveId
        );


    if(!move)
        return;


    if(
        WOD_MATCH.energy <= 0
    ){

        showMoveFeedback(
            "EXHAUSTED",
            "bad"
        );

        return;

    }


    WOD_MATCH.energy -=
        move.energy;


    const accuracy =
        Math.random();


    let quality;

    let multiplier;


    if(
        accuracy > .82
    ){

        quality =
            "PERFECT";

        multiplier =
            1.6;

        WOD_MATCH.perfects++;

        WOD_MATCH.combo++;

    }

    else if(
        accuracy > .34
    ){

        quality =
            "GOOD";

        multiplier =
            1;

        WOD_MATCH.goods++;

        WOD_MATCH.combo++;

    }

    else{

        quality =
            "MISS";

        multiplier =
            0;

        WOD_MATCH.misses++;

        WOD_MATCH.combo=0;

    }


    if(
        WOD_MATCH.combo >
        WOD_MATCH.maxCombo
    ){

        WOD_MATCH.maxCombo =
            WOD_MATCH.combo;

    }


    let points =
        Math.round(
            move.points *
            multiplier
        );


    if(
        WOD_MATCH.combo >= 3
    ){

        points +=
            WOD_MATCH.combo *
            12;

    }


    WOD_MATCH.playerScore +=
        points;


    animatePlayer(
        move.id
    );


    showMoveFeedback(
        quality +
        (
            points
            ? " +" + points
            : ""
        ),
        quality === "MISS"
            ? "bad"
            : quality === "PERFECT"
            ? "perfect"
            : "good"
    );


    updateArenaUI();

};

function opponentMove(){

    const difficulty =
        WOD_MATCH.event?.difficulty ||
        1;


    const move =
        WOD_MOVES[
            Math.floor(
                Math.random() *
                WOD_MOVES.length
            )
        ];


    const successChance =
        .38 +
        (
            difficulty *
            .08
        );


    if(
        Math.random() <
        successChance
    ){

        const points =
            Math.round(
                move.points *
                (
                    .65 +
                    Math.random()*.55
                )
            );


        WOD_MATCH.opponentScore +=
            points;


        WOD_MATCH.opponentEnergy =
            Math.max(
                0,
                WOD_MATCH.opponentEnergy -
                move.energy
            );


        animateOpponent(
            move.id
        );


        showMoveFeedback(
            "RIVAL +" + points,
            "enemy"
        );


        updateArenaUI();

    }

}

/* =========================================================
   MATCH CLOCK
========================================================= */

function startMatchClock(){

    clearInterval(
        WOD_MATCH.timer
    );


    WOD_MATCH.time=30;


    updateTimer();


    WOD_MATCH.timer =
        setInterval(
            function(){

                if(
                    !WOD_MATCH.active
                )
                    return;


                WOD_MATCH.time--;


                updateTimer();


                if(
                    WOD_MATCH.time <= 0
                ){

                    finishRound();

                }

            },
            1000
        );

}


function updateTimer(){

    const timer =
        document.getElementById(
            "wodTimer"
        );


    if(timer)
        timer.textContent =
            WOD_MATCH.time;

}


/* =========================================================
   ROUND SYSTEM
========================================================= */

function finishRound(){

    clearInterval(
        WOD_MATCH.timer
    );


    if(
        WOD_MATCH.round >=
        WOD_MATCH.totalRounds
    ){

        finishMatch();

        return;

    }


    WOD_MATCH.round++;


    WOD_MATCH.time=30;


    const playerRecovery =
        20;


    const opponentRecovery =
        15;


    WOD_MATCH.energy =
        Math.min(
            100,
            WOD_MATCH.energy +
            playerRecovery
        );


    WOD_MATCH.opponentEnergy =
        Math.min(
            100,
            WOD_MATCH.opponentEnergy +
            opponentRecovery
        );


    const roundBox =
        document.getElementById(
            "wodRoundNumber"
        );


    if(roundBox){

        roundBox.textContent =
            WOD_MATCH.round +
            " / " +
            WOD_MATCH.totalRounds;

    }


    showMoveFeedback(
        "ROUND " +
        WOD_MATCH.round,
        "round"
    );


    updateArenaUI();


    startMatchClock();

}


/* =========================================================
   FINAL MATCH
========================================================= */

function finishMatch(){

    if(
        WOD_MATCH.finished
    )
        return;


    WOD_MATCH.finished=true;

    WOD_MATCH.active=false;


    clearInterval(
        WOD_MATCH.timer
    );


    clearInterval(
        WOD_MATCH.opponentTimer
    );


    const player =
        WOD_MATCH.playerScore;


    const opponent =
        WOD_MATCH.opponentScore;


    const won =
        player >
        opponent;


    const draw =
        player ===
        opponent;


    let result;


    if(won)
        result="VICTORY";

    else if(draw)
        result="DRAW";

    else
        result="DEFEAT";


    const qualityBonus =
        (
            WOD_MATCH.perfects *
            25
        );


    const finalScore =
        player +
        qualityBonus;


    /* CONNECT TO BUILD 13 */

    if(
        typeof window.recordCompetitionResult ===
        "function"
    ){

        window.recordCompetitionResult(
            finalScore
        );

    }


    setTimeout(
        function(){

            showFinalMatchScreen(
                result,
                finalScore,
                opponent
            );

        },
        500
    );

}

    if(
        !event
    ){

        return;

    }


    const p =
        window.WOD_PLAYER ||
        {coins:0};

        p.coins <
        event.entry
    ){

            "function"

    p.coins -=

        250

function xpRequired(level){

    return Math.round(
        300 *
        Math.pow(
            1.35,
            level - 1
        )
    );

}

    amount =
        Math.max(
            0,
            Math.round(amount)
        );


    WOD_PLAYER.xp += amount;


    let levelUps = 0;

        WOD_PLAYER.xp >=
        xpRequired(
            WOD_PLAYER.level
        )
    ){

        WOD_PLAYER.xp -=
            xpRequired(
                WOD_PLAYER.level
            );

        WOD_PLAYER.level++;

        levelUps++;

    }


    saveWODPlayer();


    if(levelUps){

        showWODLevelUp(
            WOD_PLAYER.level
        );

    }

window.WOD_BUY_OR_EQUIP =
function(type,id){

    let collection;


    if(type==="outfit")
        collection =
            WOD_OUTFITS;

    else if(type==="shoes")
        collection =
            WOD_SHOES;

    else if(type==="accessory")
        collection =
            WOD_ACCESSORIES;

    else
        return;


    const item =
        collection.find(
            x => x.id === id
        );


    if(!item)
        return;


    if(
        !hasItem(item.id)
    ){

        if(
            WOD_PLAYER.coins <
            item.price
        ){

            alert(
                "Not enough coins."
            );

            return;

        }


        WOD_PLAYER.coins -=
            item.price;


        WOD_PLAYER.inventory.push(
            item.id
        );

    }


    if(type==="outfit")
        WOD_PLAYER.outfit =
            item.id;

    if(type==="shoes")
        WOD_PLAYER.shoes =
            item.id;

    if(type==="accessory")
        WOD_PLAYER.accessory =
            item.id;


    saveWODPlayer();


    renderWODCustomization();

};
